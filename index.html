/* ========================================================================
   Design tokens
   ======================================================================== */
:root{
  /* palette */
  --paper:#F5ECE0;

  --blush:#EBCFC5;
  --wine:#7A2233;

  /* radius */

  /* layered shadows, warm-tinted */
  --sh-paper:
    0 1px 0 rgba(255,251,244,.85) inset,
    0 1px 1px rgba(86,40,30,.06),
    0 4px 10px -4px rgba(86,40,30,.12),
    0 22px 40px -22px rgba(86,40,30,.30);

  --sh-wax:

    inset 0 -3px 6px rgba(40,5,12,.35),
    0 2px 3px rgba(60,10,20,.22),
    0 10px 22px -8px rgba(86,21,35,.50);

  /* motion */
  --ease-out:cubic-bezier(.22,1,.36,1);
  --ease-io:cubic-bezier(.65,0,.35,1);
  --ease-back:cubic-bezier(.34,1.45,.64,1);
  --d-1:250ms; --d-2:400ms; --d-3:550ms; --d-4:700ms;

  /* type */
  --f-display:"Aref Ruqaa","Amiri","Traditional Arabic","Times New Roman",serif;

}

/* ========================================================================
   Base
   ======================================================================== */
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
html{-webkit-text-size-adjust:100%;background:var(--paper)}
body{
  margin:0;
  font-family:var(--f-body);
  font-size:var(--fs-base);
  line-height:var(--lh-body);
  color:var(--ink);
  background:
    radial-gradient(110% 65% at 88% -12%, rgba(235,207,197,.85), transparent 62%),
    radial-gradient(90% 55% at 0% 112%, rgba(180,138,78,.22), transparent 60%),
    linear-gradient(180deg,#F7EFE4 0%,#F2E6D6 100%);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
/* paper grain */
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:50;
  opacity:.22;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .22  0 0 0 0 .16  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--wine);outline-offset:4px;border-radius:var(--r-sm)}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

#sky{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}

/* ========================================================================
   Screens
   ======================================================================== */
.screen{
  position:fixed;inset:0;z-index:1;
  display:flex;flex-direction:column;
  overflow-y:auto;overflow-x:hidden;
  overscroll-behavior:contain;
  scrollbar-width:thin;

  padding-block:max(5.75rem, calc(env(safe-area-inset-top) + 4.25rem)) max(var(--s-6), env(safe-area-inset-bottom));

}
.screen::-webkit-scrollbar{width:5px}

.display{font-family:var(--f-display);font-weight:700;color:var(--wine);margin:0;line-height:1.35;text-wrap:balance}

   ======================================================================== */
.intro{display:flex;flex-direction:column;align-items:center;text-align:center;gap:var(--s-4);max-inline-size:36rem}
.intro__text{display:flex;flex-direction:column;align-items:center;gap:var(--s-3);max-block-size:20rem;overflow:hidden;transition:max-block-size .45s var(--ease-out),opacity .4s var(--ease-out),margin .45s var(--ease-out)}
.intro.is-opening .intro__text{max-block-size:0;opacity:0;margin:0;pointer-events:none}
.intro .display{font-size:var(--fs-xl)}
.intro__foot{min-block-size:56px;display:flex;align-items:center;justify-content:center}

.env{
  --w:min(84vw, 26rem, 44dvh * 1.48);
  position:relative;inline-size:var(--w);aspect-ratio:400/270;
  margin-block:calc(var(--w) * .26) var(--s-3);
  perspective:1400px;
}
.env::before{ /* contact shadow */
  content:"";position:absolute;inset-inline:4%;inset-block-end:-9%;block-size:18%;
  background:radial-gradient(closest-side,rgba(86,40,30,.26),transparent);
}
.env__back{
  position:absolute;inset:0;border-radius:var(--r-md);
  background:linear-gradient(180deg,#DAC1A3 0%,#E6D2B9 60%);
  box-shadow:var(--sh-paper),inset 0 12px 18px -10px rgba(86,40,30,.25);
}
.env__letter{
  position:absolute;inset-inline:6%;inset-block-start:5%;block-size:88%;z-index:2;
  border-radius:var(--r-sm);padding:7% 8%;
  background:linear-gradient(180deg,var(--cream),#F7EEE2);
  box-shadow:0 1px 2px rgba(86,40,30,.10),0 -8px 16px -10px rgba(86,40,30,.22);
  display:flex;flex-direction:column;gap:7%;
}
.env.is-open .env__letter{transform:translateY(-58%);z-index:4}
.env__words{
  margin:0;text-align:center;
  font-family:var(--f-display);font-weight:700;color:var(--wine);
  font-size:clamp(1rem,3.6vw,1.28rem);line-height:1.65;
}
.env__words .w{
  display:inline-block;opacity:0;margin-inline:.06em;
  transform:translateY(.28em);
  transition:opacity .42s var(--ease-out),transform .42s var(--ease-out);
}
.env__words .w.is-on{opacity:1;transform:none}
.env-next{
  inline-size:52px;block-size:52px;padding:0;border:0;border-radius:50%;
  display:grid;place-items:center;cursor:pointer;color:var(--wine);
  background:rgba(251,243,234,.92);
  box-shadow:0 0 0 1px rgba(122,34,51,.16),0 12px 18px -14px rgba(86,21,35,.6);
}
.env-next svg{inline-size:22px;block-size:22px}
.env__front{position:absolute;inset:0;inline-size:100%;block-size:100%;z-index:3;overflow:visible}
.env__addr{
  position:absolute;z-index:4;inset-inline:0;inset-block-end:5.5%;text-align:center;
  font-family:var(--f-display);font-size:clamp(1.15rem,4.2vw,1.45rem);color:var(--wine);line-height:1;
}
.env__flap{
  position:absolute;inset-inline:0;inset-block-start:0;block-size:63.7%;z-index:5;
  transform-origin:50% 0;
}
.env__flap svg{inline-size:100%;block-size:100%;display:block;overflow:visible;filter:drop-shadow(0 3px 3px rgba(86,40,30,.16))}
.env.is-open .env__flap{transform:rotateX(180deg);z-index:1}
.env.is-open .seal{visibility:hidden}

.seal{
  position:absolute;z-index:6;left:50%;top:61.5%;translate:-50% -50%;
  inline-size:clamp(4.5rem,21%,5.75rem);aspect-ratio:1;
  padding:0;border:0;background:none;border-radius:50%;cursor:pointer;
  filter:drop-shadow(0 6px 8px rgba(86,21,35,.32)) drop-shadow(0 1px 1px rgba(60,10,20,.3));
}
.seal::before{
  content:"";position:absolute;inset:-10%;border-radius:50%;
  border:1.5px solid rgba(122,34,51,.38);opacity:0;
}
.s1.is-active .seal::before{animation:ring 2.8s var(--ease-out) infinite}
@keyframes ring{0%{transform:scale(.88);opacity:0}25%{opacity:.9}100%{transform:scale(1.3);opacity:0}}
.seal__body{position:absolute;inset:0;transition:transform var(--d-2) var(--ease-back)}
@media (hover:hover){.seal:hover .seal__body{transform:translateY(-3px) scale(1.04) rotate(-3deg)}}
.seal:active .seal__body{transform:scale(.94)}
.seal.is-breaking::before{display:none}
.seal:focus-visible{outline-offset:8px;border-radius:50%}
.seal__half,.seal__crack{position:absolute;inset:0;inline-size:100%;block-size:100%}
.seal__half--r{clip-path:polygon(52% 0,100% 0,100% 100%,53% 100%,48% 84%,54% 68%,46% 52%,55% 34%,47% 18%)}
.seal__half--l{clip-path:polygon(0 0,52% 0,47% 18%,55% 34%,46% 52%,54% 68%,48% 84%,53% 100%,0 100%)}
.seal__crack{opacity:0;pointer-events:none}
.crumbs{position:absolute;left:50%;top:61.5%;z-index:7;pointer-events:none}
.crumbs span{position:absolute;inline-size:7px;block-size:6px;border-radius:40% 60% 55% 45%;background:var(--wine);margin:-3px}

.hint{display:inline-flex;align-items:center;gap:.5em;color:var(--ink-soft);font-size:var(--fs-sm)}
.hint svg{inline-size:18px;block-size:18px;color:var(--wine);animation:nudge 2.2s var(--ease-io) infinite}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

/* ========================================================================
   Screen 2 — the three notes
   ======================================================================== */
.s2 .stage{max-inline-size:34rem}
.s2__head{display:flex;flex-direction:column;align-items:center;text-align:center;gap:var(--s-3)}
.s2__head .display{font-size:var(--fs-lg)}

.notes{list-style:none;margin:var(--s-6) 0 var(--s-6);padding:0;display:flex;flex-direction:column;gap:var(--s-5)}
.note{
  position:relative;perspective:1100px;
  transform:rotate(var(--tilt));
  transition:transform var(--d-3) var(--ease-out);
}
.note--1{--tilt:-1.1deg;align-self:flex-start;inline-size:95%}
.note--2{--tilt:1deg;align-self:flex-end;inline-size:95%}
.note--3{--tilt:-.5deg;align-self:center;inline-size:97%}
@media (hover:hover){.note:hover{transform:rotate(0deg) translateY(-3px)}}
.note:has(.note__hit:active){transform:rotate(0deg) scale(.985)}

.note__hit{
  position:absolute;inset:0;z-index:4;inline-size:100%;
  border:0;background:transparent;cursor:pointer;border-radius:var(--r-md);
}
.note__hit:focus-visible{outline-offset:6px;border-radius:var(--r-md)}
.note__card{display:grid;transform-style:preserve-3d;transition:transform var(--d-4) var(--ease-out)}
.note__face{
  grid-area:1/1;position:relative;
  -webkit-backface-visibility:hidden;backface-visibility:hidden;
  min-block-size:7.25rem;border-radius:var(--r-md);
  padding:1rem 1.05rem;padding-inline-end:4.75rem;
  display:flex;flex-direction:column;justify-content:center;gap:.15rem;
  box-shadow:var(--sh-paper),0 0 0 1px var(--hair);
}
.note__num{
  display:inline-grid;place-items:center;inline-size:2.1rem;block-size:2.1rem;border-radius:50%;
  font-family:var(--f-display);font-size:1.15rem;line-height:1;color:var(--wine);
  box-shadow:inset 0 0 0 1px rgba(180,138,78,.7);
  margin-block-end:var(--s-1);
  transition:background-color var(--d-3) var(--ease-out),color var(--d-3) var(--ease-out),box-shadow var(--d-3);
}
.note.is-seen .note__num{color:#FBF1E9;background:radial-gradient(circle at 35% 30%,#A43A4E,var(--wine) 60%,var(--wine-deep));box-shadow:var(--sh-wax)}
.note__title{font-family:var(--f-display);font-weight:700;font-size:clamp(1.22rem,1.1rem + .4vw,1.48rem);color:var(--wine);line-height:1.28}
.note__hint{font-size:.9rem;color:var(--ink-soft);line-height:1.35}
.note__art{position:absolute;inset-inline-end:var(--s-4);top:50%;translate:0 -50%;block-size:68%;inline-size:auto;pointer-events:none}
.note__label{font-size:.84rem;font-weight:500;color:var(--gold-ink);line-height:1.35}
.note__text{margin:0;font-size:.92rem;line-height:1.5;color:var(--ink);text-wrap:pretty}
.note__back{padding-inline-end:var(--s-6)}
.note__turn{position:absolute;inset-inline-end:var(--s-3);inset-block-start:var(--s-3);inline-size:18px;block-size:18px;color:var(--ink-soft);opacity:.7}

/* 1 — pressed flower card: flips sideways */
.note--1 .note__face{background:linear-gradient(160deg,#FCF7EF,#F3E8D9)}
.note--1 .note__back{transform:rotateY(180deg)}
.note--1.is-open .note__card{transform:rotateY(-180deg)}

/* 2 — ticket stub: flips vertically */
.note--2{filter:drop-shadow(0 10px 14px rgba(86,40,30,.14))}
.note--2 .note__face{
  background:linear-gradient(160deg,#F6E3DA,#EED3C8);box-shadow:none;
  -webkit-mask:radial-gradient(circle at 0 50%,#0000 11px,#000 11.5px) left/51% 100% no-repeat,radial-gradient(circle at 100% 50%,#0000 11px,#000 11.5px) right/51% 100% no-repeat;
          mask:radial-gradient(circle at 0 50%,#0000 11px,#000 11.5px) left/51% 100% no-repeat,radial-gradient(circle at 100% 50%,#0000 11px,#000 11.5px) right/51% 100% no-repeat;
}
.note--2 .note__front::after{
  content:"";position:absolute;inset-block:14%;inset-inline-end:5.25rem;
  border-inline-start:1.5px dashed rgba(122,34,51,.28);
}
.note--2 .note__back{transform:rotateX(180deg)}
.note--2.is-open .note__card{transform:rotateX(180deg)}

/* 3 — sealed kraft note: the cover folds up */
.note--3 .note__front{
  background:
    linear-gradient(135deg,transparent 0 calc(100% - 2.2rem),rgba(122,80,40,.14) calc(100% - 2.2rem) calc(100% - 2.1rem),#F0E0C3 calc(100% - 2.1rem)),
    linear-gradient(165deg,#EBD8B6,#E1C9A1);
  transform-origin:50% 0;transform:translateZ(1px);
  transition:transform var(--d-4) var(--ease-out);
}
.note--3 .note__front .note__hint{color:var(--ink)}
.note--3 .note__back{
  background:
    repeating-linear-gradient(180deg,transparent 0 1.5em,rgba(122,34,51,.07) 1.5em calc(1.5em + 1px)),
    linear-gradient(180deg,var(--cream),#F6EDE0);
}
.note--3.is-open .note__front{transform:rotateX(-180deg) translateZ(1px)}

.s2__foot{display:flex;justify-content:center;padding-block-start:var(--s-4)}
.note-next{
  inline-size:52px;block-size:52px;padding:0;border:0;border-radius:50%;
  display:grid;place-items:center;cursor:pointer;color:var(--wine);
  background:rgba(251,243,234,.92);
  box-shadow:0 0 0 1px rgba(122,34,51,.16),0 12px 18px -14px rgba(86,21,35,.6);
  transition:opacity var(--d-2) var(--ease-out),transform var(--d-2) var(--ease-out);
}
.note-next svg{inline-size:22px;block-size:22px}
.note-next:disabled{opacity:.32;cursor:default;box-shadow:0 0 0 1px rgba(122,34,51,.12)}
.note-next:not(:disabled):hover{transform:translateY(-2px)}

@media (min-width:56rem){
  .s2 .stage{max-inline-size:54rem}
  .notes{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-5) var(--s-6);margin-block:var(--s-6)}
  .note--1,.note--2{inline-size:100%}
  .note--2{margin-block-start:var(--s-6)}
  .note--3{grid-column:1/-1;justify-self:center;inline-size:min(100%,28rem);margin-block-start:calc(var(--s-3) * -1)}
  .s2__foot{max-inline-size:34rem;margin-inline:auto}
}
@media (min-width:56rem) and (max-height:56rem){
  .notes{margin-block:var(--s-5) var(--s-4)}
  .note--2{margin-block-start:var(--s-5)}
  .note__face{min-block-size:6.5rem}
  .s2__foot{padding-block-start:var(--s-3)}
  .topbar{margin-block-end:0}
}

/* ========================================================================
   Screen 3 — same letter as index1: thread, signature, heart
   ======================================================================== */
.chapter{
  margin:0 0 1.35rem;
  text-align:center;
  font-family:"Reem Kufi","Aref Ruqaa",serif;
  font-weight:700;
  font-size:clamp(1.15rem,.95rem + .55vw,1.45rem);
  line-height:1.3;
  color:var(--wine);
}
.s3 .chapter,.s4 .chapter,.s5 .chapter,.s6 .chapter{color:#BF2A2A}
.s5 .chapter{
  position:absolute;
  inset-inline:1rem;
  top:max(6rem,calc(env(safe-area-inset-top) + 4.5rem));
  margin:0;
}
.s3,.s4,.s5,.s6{
  padding:0;
  background:#F1E5D7;
  color:#2A1C18;
  font-family:"IBM Plex Sans Arabic","Readex Pro",system-ui,sans-serif;
}
.s3 .stage,.s4 .stage,.s5 .stage,.s6 .stage{
  max-inline-size:52rem;
  margin-inline:auto;
  margin-block:auto;
  padding-block:max(6rem,calc(env(safe-area-inset-top) + 4.5rem)) max(2rem,env(safe-area-inset-bottom));
  padding-inline:max(1.35rem,env(safe-area-inset-right)) max(1.35rem,env(safe-area-inset-left));
}
.s5 .stage{
  max-inline-size:64rem;
  min-block-size:100%;
  display:flex;
  align-items:center;
  padding-block:max(6rem,calc(env(safe-area-inset-top) + 4.5rem)) 1.25rem;
}
.ln{display:block;overflow:hidden;padding-block:.14em .08em;margin-block:-.08em}
.ln__in{display:block}
.s3 em{font-style:normal;color:#BF2A2A}
.s3 .salute{
  margin:0 0 2rem;
  font-family:"Reem Kufi","Aref Ruqaa",serif;
  font-weight:700;
  font-size:clamp(2.6rem,1.6rem + 5.5vw,5.2rem);
  line-height:1.05;
  color:#BF2A2A;
}
.letter-body{position:relative;padding-inline-start:2rem}
.t3{position:absolute;inset-block:0;inset-inline-start:0;inline-size:16px;block-size:100%;overflow:visible}
#t3path,#t4path,#t6path{fill:none;stroke:#BF2A2A;stroke-width:1.8;stroke-linecap:round}
.s4 .ln__in,.s6 .ln__in{transform:translateY(105%)}
.s4 .ln__in.is-in,.s6 .ln__in.is-in{transform:none;transition:transform .8s cubic-bezier(.22,1,.36,1)}
.letter-body p{margin:0 0 1.5rem;font-size:clamp(1.2rem,1.06rem + .7vw,1.5rem);line-height:1.95}
.letter-body .ln{padding-block:0;margin-block:0}
.sign{display:flex;flex-direction:column;align-items:flex-end;margin-block-start:2rem}
.sign__close{color:#66504A;line-height:1.4}
.sign__name{font-family:"Aref Ruqaa",serif;font-weight:700;font-size:clamp(1.9rem,1.3rem + 3vw,3.2rem);color:#BF2A2A;line-height:1.5}
.finale{position:relative;margin-block:3.5rem 1.5rem;text-align:center}
.finale:not(.is-on){visibility:hidden}
.knot-svg{display:block;inline-size:100%;max-inline-size:28rem;margin-inline:auto;block-size:auto;overflow:visible}
#knotPath{fill:none;stroke:#BF2A2A;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
#knotG{transform-box:fill-box;transform-origin:50% 70%}
#knotGlow{transform-box:fill-box;transform-origin:center;opacity:0}
.knot-name{font-family:"Aref Ruqaa",serif;font-weight:700;font-size:22px;fill:#66504A}
.payoff{
  margin:1rem 0 0;
  font-family:"Reem Kufi","Aref Ruqaa",serif;
  font-weight:700;
  font-size:clamp(2.6rem,1.6rem + 5.5vw,5.2rem);
  line-height:1.05;
  color:#2A1C18;
}
.promise{
  margin:0;
  inline-size:100%;
  text-align:center;
  font-family:"Reem Kufi","Aref Ruqaa",serif;
  font-weight:700;
  font-size:clamp(2rem,1.15rem + 3.4vw,3.6rem);
  line-height:1.65;
  text-wrap:balance;
}
.promise .w{
  display:inline-block;
  opacity:0;
  margin-inline:.1em;
  color:#2A1C18;
}
.promise .w.is-on{opacity:1}
.promise .w.is-now{color:#BF2A2A}

.dock{
  position:fixed;z-index:80;direction:ltr;
  top:max(12px,env(safe-area-inset-top));
  left:max(12px,env(safe-area-inset-left));
  display:flex;gap:8px;
}
.dock__btn{
  inline-size:44px;block-size:44px;padding:0;border:0;border-radius:50%;
  display:grid;place-items:center;cursor:pointer;color:#2A1C18;
  background:rgba(251,243,234,.84);
  box-shadow:0 0 0 1px rgba(42,28,24,.12),0 10px 18px -14px rgba(42,28,24,.55);
  backdrop-filter:blur(8px);
}
.dock__btn svg{inline-size:20px;block-size:20px}
.dock__btn:disabled{opacity:.32;cursor:default}
.dock__back{
  inline-size:auto;padding-inline:.9rem;border-radius:999px;
  font-family:"Readex Pro",system-ui,sans-serif;font-size:.92rem;font-weight:500;
}
.mute-slash{opacity:0}
.dock__btn.is-muted .mute-slash{opacity:1;stroke:#BF2A2A}
.dock__btn.is-muted .vol-waves{opacity:0}

/* ========================================================================
   Reduced motion: everything just appears
   ======================================================================== */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  .seal::before{display:none}
  .s4 .ln__in,.s5 .ln__in{transform:none!important}
}
</style>
</head>

<noscript><p style="position:fixed;inset:auto 0 0;padding:1rem;text-align:center;background:#F5ECE0">الجواب ده محتاج JavaScript يكون شغّال عشان يتفتح.</p></noscript>

<script>
(() => {
  "use strict";

  /* ---------- helpers ---------- */
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const mqReduce = matchMedia("(prefers-reduced-motion: reduce)");
  const reduced = () => mqReduce.matches;
  const EASE_OUT = "cubic-bezier(.22,1,.36,1)";
  const EASE_IO = "cubic-bezier(.65,0,.35,1)";
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const names = (s) => String(s).replace(/\{her\}/g, CONFIG.names.her).replace(/\{him\}/g, CONFIG.names.him);
  const T = (path) => names(path.split(".").reduce((o, k) => (o ? o[k] : ""), CONFIG.screens) ?? "");
  const buzz = (p) => {
    try {
      const active = !navigator.userActivation || navigator.userActivation.hasBeenActive;
      if (navigator.vibrate && active) navigator.vibrate(p);
    } catch (_) {}
  };
  const live = $("#live");
  const say = (msg) => { live.textContent = ""; requestAnimationFrame(() => { live.textContent = msg; }); };

  const state = { screen: 0, step: 0, sealBroken: false, opened: new Set(), letterRead: false, busy: false };
  // الظرف، الاعتذار، صوت المحاولة، الورقات، الدلع، الحنية
  const FLOW = [1, 3, 5, 2, 4, 6];
  const LAST = FLOW.length;

  /* ---------- background music: start immediately, then loop ---------- */
  const bgm = $("#bgm");
  const voice = $("#voice");
  const MUSIC_VOL = .42;
  const MUSIC_DUCK = .08;
  let musicOn = true;
  bgm.loop = true;
  bgm.volume = MUSIC_VOL;
  function kickMusic() {
    if (!musicOn || state.screen === 5 || !bgm.paused) return;
    bgm.muted = false;
    bgm.volume = MUSIC_VOL;
    bgm.play().catch(() => {});
  }
  kickMusic();
  bgm.addEventListener("canplay", kickMusic);
  bgm.addEventListener("loadeddata", kickMusic);
  addEventListener("pointerdown", (e) => { if (e.target.closest && e.target.closest("#muteBtn")) return; kickMusic(); }, { capture: true });
  addEventListener("keydown", () => kickMusic(), { capture: true });
  function renderMute() {
    const btn = $("#muteBtn");
    btn.classList.toggle("is-muted", !musicOn);
    btn.setAttribute("aria-pressed", String(!musicOn));
    btn.setAttribute("aria-label", musicOn ? "اكتم الموسيقى" : "شغّل الموسيقى");
  }
  function setMusic(on) {
    musicOn = on;
    bgm.muted = !on;
    voice.muted = !on;
    if (!on) { bgm.volume = 0; bgm.pause(); }
    else { bgm.volume = MUSIC_VOL; if (state.screen !== 5) kickMusic(); }
    renderMute();
  }
  function duck(on) {
    if (!musicOn) { bgm.volume = 0; return; }
    bgm.volume = on ? MUSIC_DUCK : MUSIC_VOL;
  }
  $("#muteBtn").addEventListener("click", () => {
    buzz(6);
    if (bgm.paused && musicOn && state.screen !== 5) { kickMusic(); return; }
    setMusic(!musicOn);
  });

  /* ---------- content ---------- */
  document.title = names("جواب لـ{her}");
  $$("[data-t]").forEach((el) => { el.textContent = T(el.dataset.t); });
  $$("[data-t-label]").forEach((el) => el.setAttribute("aria-label", T(el.dataset.tLabel)));
  $$("[data-item]").forEach((el) => { el.textContent = names(CONFIG.items[+el.dataset.item][el.dataset.field]); });

  /* ---------- screens & routing ---------- */
  const screens = { 1: $("#s1"), 2: $("#s2"), 3: $("#s3"), 4: $("#s4"), 5: $("#s5"), 6: $("#s6") };
  const KINDS = {
    envelope: {
      out: [{ opacity: 1, transform: "none" }, { opacity: 0, transform: "translateY(8%) scale(.94)" }], outDur: 650,
      in: [{ opacity: 0, transform: "translateY(24%) scale(.86) rotate(-1.5deg)" }, { opacity: 1, transform: "none" }], inDur: 950, inDelay: 160,
    },
    forward: {
      out: [{ opacity: 1, transform: "none" }, { opacity: 0, transform: "translateY(-6%) rotate(-3deg) scale(.96)" }], outDur: 560,
      in: [{ opacity: 0, transform: "translateY(9%) rotate(2deg) scale(.98)" }, { opacity: 1, transform: "none" }], inDur: 780, inDelay: 200,
    },
    back: {
      out: [{ opacity: 1, transform: "none" }, { opacity: 0, transform: "translateY(9%) rotate(2deg) scale(.98)" }], outDur: 500,
      in: [{ opacity: 0, transform: "translateY(-6%) rotate(-3deg) scale(.96)" }, { opacity: 1, transform: "none" }], inDur: 700, inDelay: 160,
    },
  };
  let pendingKind = null;
  let running = [];

  const parseHash = () => { const n = parseInt(location.hash.slice(1), 10); return n >= 1 && n <= LAST ? n : 1; };
  function go(n, kind) {
    pendingKind = kind || null;
    if (parseHash() === n) show(n); else location.hash = "#" + n;
  }
  addEventListener("hashchange", () => show(parseHash()));

  function stagger(el, base) {
    if (reduced()) return;
    $$("[data-stagger]", el).forEach((x, i) => {
      x.animate([{ opacity: 0, transform: "translateY(14px)" }, { opacity: 1, transform: "none" }],
        { duration: 600, delay: base + i * 85, easing: EASE_OUT, fill: "backwards" });
    });
  }

  function show(step, { instant = false } = {}) {
    if (state.step === step) return;
    const n = FLOW[step - 1];
    const from = state.screen;
    const fromStep = state.step;
    const fromEl = screens[from], toEl = screens[n];
    const kind = pendingKind || (step > fromStep ? "forward" : "back");
    pendingKind = null;

    running.filter((a) => a.playState === "running").forEach((a) => a.finish());
    running = [];
    state.step = step;
    state.screen = n;
    if (from === 1) clearEnvTimers();
    if (from === 3) finishLetter();
    if (from === 4 || from === 5 || from === 6) stopVoice();
    updateNav();
    beforeEnter(n);
    Object.entries(screens).forEach(([k, el]) => {
      const on = +k === n;
      el.classList.toggle("is-active", on);
      el.inert = !on;
      el.setAttribute("aria-hidden", String(!on));
    });
    toEl.scrollTop = 0;

    if (instant || !fromEl || reduced()) {
      if (fromEl) { fromEl.classList.remove("is-leaving"); if (from === 1) resetIntroFx(); }
      if (instant) stagger(toEl, 120);
      if (n === 4 || n === 6) startReading(n);
      if (n === 5) startApology();
      afterEnter(n, !instant);
      return;
    }

    fromEl.classList.add("is-leaving");
    const K = KINDS[kind];
    const a1 = $("[data-move]", fromEl).animate(K.out, { duration: K.outDur, easing: EASE_IO, fill: "forwards" });
    const a2 = $("[data-move]", toEl).animate(K.in, { duration: K.inDur, delay: K.inDelay, easing: EASE_OUT, fill: "backwards" });
    running = [a1, a2];
    stagger(toEl, K.inDelay + 140);
    a1.finished.then(() => {
      fromEl.classList.remove("is-leaving");
      a1.cancel();
      if (from === 1) resetIntroFx();
    }).catch(() => {});
    if (n === 3) revealLetter(K.inDelay + 500);
    if (n === 4 || n === 6) startReading(n);
    if (n === 5) startApology();
    a2.finished.then(() => afterEnter(n, true)).catch(() => {});
  }

  function beforeEnter(n) {
    if (n === 1) applyEnvelope();
    if (n === 2) renderNotes();
    if (n === 3 && state.letterRead) setLetterDone();
  }
  function afterEnter(n, focus) {
    const labels = { 1: T("intro.chapter"), 2: T("notes.chapter"), 3: T("letter.chapter"), 4: T("sweet.chapter"), 5: T("try.chapter"), 6: T("hold.chapter") };
    say(labels[n]);
    if (focus) { const h = $(`#s${n}-title`); if (h) h.focus({ preventScroll: true }); }
    if (n === 1 && state.sealBroken && !state.envRead && !state.busy) writeEnvelope();
    if (n === 3 && !state.letterRead && reduced()) setLetterDone();
    if (n === 3 && !state.letterRead && !letterAnims.length) revealLetter(300);
  }

  function updateNav() {
    $("#navPrev").disabled = state.step <= 1;
    $("#navNext").disabled = state.step >= LAST;
  }
  $("#navPrev").addEventListener("click", () => { if (state.step > 1) { buzz(6); go(state.step - 1, "back"); } });
  $("#navNext").addEventListener("click", () => { if (state.step < LAST) { buzz(6); go(state.step + 1, "forward"); } });
  /* ---------- screen 1: the seal ---------- */
  const env = $("#env"), seal = $("#seal"), hint = $("#sealHint"), envNext = $("#envNext"), envLetter = $("#envLetter"), envWords = $("#envWords");
  let introFx = [];
  let envTimers = [];
  state.envRead = false;

  T("intro.inside").split(/\s+/).filter(Boolean).forEach((word) => {
    const el = document.createElement("span");
    el.className = "w";
    el.textContent = word;
    envWords.appendChild(el);
  });

  function clearEnvTimers() {
    envTimers.forEach(clearTimeout);
    envTimers = [];
  }
  function applyEnvelope() {
    env.classList.toggle("is-open", state.sealBroken);
    seal.hidden = state.sealBroken;
    hint.hidden = state.sealBroken;
    $(".intro").classList.toggle("is-opening", state.sealBroken);
    envLetter.setAttribute("aria-hidden", String(!state.sealBroken));
    envNext.hidden = !(state.sealBroken && state.envRead);
    if (state.envRead) $$(".w", envWords).forEach((w) => w.classList.add("is-on"));
  }
  function writeEnvelope() {
    clearEnvTimers();
    const words = $$(".w", envWords);
    if (reduced()) {
      words.forEach((w) => w.classList.add("is-on"));
      state.envRead = true;
      applyEnvelope();
      return;
    }
    words.forEach((w, i) => {
      envTimers.push(setTimeout(() => {
        if (state.screen !== 1) return;
        w.classList.add("is-on");
        if (i !== words.length - 1) return;
        state.envRead = true;
        envTimers.push(setTimeout(() => {
          if (state.screen !== 1) return;
          envNext.hidden = false;
          envNext.animate([{ opacity: 0, transform: "translateY(8px)" }, { opacity: 1, transform: "none" }], { duration: 420, easing: EASE_OUT, fill: "backwards" });
        }, 320));
      }, 280 + i * 340));
    });
  }
  function resetIntroFx() { introFx.forEach((a) => a.cancel()); introFx = []; }

  function crumbs() {
    const box = $("#crumbs");
    for (let i = 0; i < 9; i++) {
      const s = document.createElement("span");
      box.appendChild(s);
      const ang = (Math.PI * 2 * i) / 9 + Math.random() * .5;
      const dist = 34 + Math.random() * 40;
      const x = Math.cos(ang) * dist, y = Math.sin(ang) * dist * .6 + 30 + Math.random() * 30;
      s.animate([
        { transform: "translate(0,0) rotate(0) scale(1)", opacity: 1 },
        { transform: `translate(${x}px, ${y}px) rotate(${Math.random() * 300}deg) scale(.6)`, opacity: 0 },
      ], { duration: 700 + Math.random() * 400, easing: "cubic-bezier(.2,.6,.4,1)", fill: "forwards" })
        .finished.then(() => s.remove()).catch(() => s.remove());
    }
  }

  async function breakSeal() {
    if (state.sealBroken || state.busy) return;
    state.busy = true;
    buzz([12, 40, 18]);

    if (reduced()) {
      state.sealBroken = true; state.envRead = true; applyEnvelope(); state.busy = false;
      return;
    }

    $(".intro").classList.add("is-opening");
    const text = $("#introText");
    introFx.push(
      text.animate([{ opacity: 1, transform: "none" }, { opacity: 0, transform: "translateY(-10px)" }], { duration: 500, easing: EASE_IO, fill: "forwards" }),
      hint.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 300, fill: "forwards" })
    );

    seal.classList.add("is-breaking");
    const bodyEl = $(".seal__body", seal);
    await bodyEl.animate([{ transform: "scale(1)" }, { transform: "scale(.9)" }, { transform: "scale(1.03)" }], { duration: 280, easing: EASE_OUT }).finished;
    $(".seal__crack", seal).animate([{ opacity: 0 }, { opacity: 1 }], { duration: 110, fill: "forwards" });
    await wait(150);

    const fall = { duration: 950, easing: "cubic-bezier(.45,0,.75,.6)", fill: "forwards" };
    $(".seal__half--l", seal).animate([
      { transform: "none", opacity: 1 },
      { transform: "translate(-14%, -4%) rotate(-12deg)", opacity: 1, offset: .3 },
      { transform: "translate(-42%, 120%) rotate(-48deg)", opacity: 0 },
    ], fall);
    $(".seal__half--r", seal).animate([
      { transform: "none", opacity: 1 },
      { transform: "translate(14%, -6%) rotate(10deg)", opacity: 1, offset: .3 },
      { transform: "translate(46%, 130%) rotate(40deg)", opacity: 0 },
    ], fall);
    $(".seal__crack", seal).animate([{ opacity: 1 }, { opacity: 0 }], { duration: 260, delay: 120, fill: "forwards" });
    crumbs();
    buzz(10);
    await wait(320);

    const flap = $(".env__flap");
    const fa = flap.animate([{ transform: "rotateX(0deg)" }, { transform: "rotateX(180deg)" }], { duration: 760, easing: EASE_IO, fill: "forwards" });
    setTimeout(() => { flap.style.zIndex = "1"; }, 380);
    await fa.finished;

    const letter = $(".env__letter");
    const la = letter.animate([{ transform: "translateY(0)" }, { transform: "translateY(-58%)" }], { duration: 760, easing: EASE_OUT, fill: "forwards" });
    await la.finished;

    state.sealBroken = true;
    applyEnvelope();
    fa.cancel(); la.cancel(); flap.style.zIndex = "";
    state.busy = false;
    writeEnvelope();
  }

  seal.addEventListener("click", breakSeal);
  envNext.addEventListener("click", () => { buzz(6); go(2, "envelope"); });

  /* ---------- screen 2: notes ---------- */
  const noteEls = $$(".note");
  const next = $("#next");

  function setNote(i, open) {
    const li = noteEls[i];
    li.classList.toggle("is-open", open);
    $(".note__hit", li).setAttribute("aria-expanded", String(open));
    $(".note__back", li).setAttribute("aria-hidden", String(!open));
  }
  function renderNotes() {
    noteEls.forEach((li, i) => {
      const seen = state.opened.has(i);
      li.classList.toggle("is-seen", seen);
      $(".note__hint", li).textContent = seen ? T("notes.seenHint") : T("notes.openHint");
    });
    updateProgress(false);
  }
  function updateProgress(animate) {
    const ready = state.opened.size >= 3;
    const wasReady = !next.disabled;
    next.disabled = !ready;
    if (ready && !wasReady && animate && !reduced()) {
      next.animate([{ transform: "scale(.86)" }, { transform: "scale(1.08)" }, { transform: "scale(1)" }], { duration: 520, easing: EASE_OUT });
    }
  }
  noteEls.forEach((li, i) => {
    $(".note__hit", li).addEventListener("click", () => {
      const open = !li.classList.contains("is-open");
      setNote(i, open);
      if (open) {
        buzz(8);
        if (!state.opened.has(i)) {
          state.opened.add(i);
          setTimeout(() => { li.classList.add("is-seen"); $(".note__hint", li).textContent = T("notes.seenHint"); }, reduced() ? 0 : 500);
          updateProgress(true);
        }
      } else buzz(4);
    });
  });
  next.addEventListener("click", () => {
    if (next.disabled) return;
    buzz(10);
    go(state.step + 1, "forward");
  });

  /* ---------- screen 3: the letter, then the heart ---------- */
  const letterEl = $("#letter");
  const letterBody = $("#letterBody");
  const thread = $("#t3path");
  const finale = $("#finale");
  const SPRING = "linear(0,.009,.035 2.1%,.141,.281 6.7%,.723 12.9%,.938 16.7%,1.017,1.077,1.121,1.149 24.3%,1.159,1.163,1.161,1.154 29.9%,1.129 32.8%,1.051 39.6%,1.017 43.1%,.991,.977 51%,.974 53.8%,.975 57.1%,.997 69.8%,1.003 76.9%,1.004 83.8%,1)";
  let letterAnims = [];
  let letterTimers = [];
  let userScrolled = false;
  let finaleOn = false;

  function richText(el, str) {
    el.textContent = "";
    names(str).split("*").forEach((part, i) => {
      if (!part) return;
      if (i % 2) { const em = document.createElement("em"); em.textContent = part; el.appendChild(em); }
      else el.appendChild(document.createTextNode(part));
    });
  }
  function splitLines(el, text) {
    el.textContent = "";
    const spans = text.split(/\s+/).filter(Boolean).map((w) => {
      const s = document.createElement("span");
      s.textContent = w + " ";
      el.appendChild(s);
      return s;
    });
    const lines = [];
    let top = null;
    let cur;
    spans.forEach((s) => {
      if (s.offsetTop !== top) { cur = []; lines.push(cur); top = s.offsetTop; }
      cur.push(s.textContent);
    });
    el.textContent = "";
    lines.forEach((ws) => {
      const ln = document.createElement("span");
      ln.className = "ln";
      const inner = document.createElement("span");
      inner.className = "ln__in";
      inner.textContent = ws.join("").trimEnd();
      ln.appendChild(inner);
      el.appendChild(ln);
    });
  }
  function buildLetter() {
    splitLines($("#s3-title"), T("letter.salutation"));
    $$("p", letterBody).forEach((p) => p.remove());
    CONFIG.apology.forEach((txt) => {
      const p = document.createElement("p");
      letterBody.appendChild(p);
      splitLines(p, names(txt));
    });
    const h = Math.max(letterBody.offsetHeight, 1);
    $("#t3").setAttribute("viewBox", `0 0 16 ${h}`);
    let d = "M8 0";
    for (let y = 0, k = 0; y < h; y += 64, k++) d += ` Q${k % 2 ? 2 : 14} ${y + 32} 8 ${Math.min(y + 64, h)}`;
    thread.setAttribute("d", d);
  }

  /* screen 4 writes itself over the background music; screen 5 is the apology */
  const spoken = {
    4: { body: $("#voiceBody"), svg: $("#t4"), path: $("#t4path"), lines: [], text: () => CONFIG.voice },
    6: { body: $("#closeBody"), svg: $("#t6"), path: $("#t6path"), lines: [], text: () => CONFIG.hold },
  };
  const READ_MS = 52000;
  const PROMISE_CUES = [
    [0.00, "لو"], [0.72, "فضلتي"], [1.10, "زعلانة"], [1.60, "أنا"], [1.72, "هحاول"],
    [2.10, "تالت"], [2.64, "ورابع"], [3.22, "وعاشر"], [5.00, "لحد"], [5.54, "ما"],
    [5.66, "تسامحيني"], [7.94, "عشان"], [8.68, "أنت"], [8.84, "تستاهلي"], [9.44, "إن"],
    [10.26, "أنا"], [10.42, "أحاول"], [10.68, "علشانك"], [15.52, "وعشان"], [16.22, "أنا"],
    [16.36, "مش"], [16.52, "هعرف"], [16.88, "أعيش"], [17.02, "منغيرك"],
  ];
  let voiceRaf = 0;
  let voiceGen = 0;
  let voiceScreen = 0;
  let userScrolledVoice = false;
  let bgmHeld = false;

  function buildSpoken(n) {
    const s = spoken[n];
    $$("p", s.body).forEach((p) => p.remove());
    s.text().forEach((txt) => {
      const p = document.createElement("p");
      s.body.appendChild(p);
      splitLines(p, txt);
    });
    const nodes = $$(".ln__in", s.body);
    const weights = nodes.map((el) => Math.max(1, el.textContent.trim().length));
    const total = weights.reduce((a, b) => a + b, 0) || 1;
    let acc = 0;
    s.lines = nodes.map((el, i) => {
      const at = (acc / total) * .96;
      acc += weights[i];
      el.classList.remove("is-in");
      return { el, at, shown: false };
    });
    const h = Math.max(s.body.offsetHeight, 1);
    s.svg.setAttribute("viewBox", `0 0 16 ${h}`);
    let d = "M8 0";
    for (let y = 0, k = 0; y < h; y += 64, k++) d += ` Q${k % 2 ? 2 : 14} ${y + 32} 8 ${Math.min(y + 64, h)}`;
    s.path.setAttribute("d", d);
    s.path.style.strokeDasharray = "1 1";
    s.path.style.strokeDashoffset = "1";
  }
  function paintVoice(p) {
    const s = spoken[voiceScreen];
    if (!s) return;
    s.lines.forEach((line) => {
      if (line.shown || p < line.at) return;
      line.shown = true;
      line.el.classList.add("is-in");
      if (userScrolledVoice || state.screen !== voiceScreen) return;
      const sc = screens[voiceScreen];
      const r = line.el.getBoundingClientRect();
      if (r.bottom > sc.clientHeight * .8) sc.scrollBy({ top: r.bottom - sc.clientHeight * .52, behavior: reduced() ? "auto" : "smooth" });
    });
    s.path.style.strokeDashoffset = String(Math.max(0, 1 - p));
  }
  function releaseMusic() {
    const held = bgmHeld;
    bgmHeld = false;
    if (held) kickMusic();
  }
  function holdMusic() {
    bgm.pause();
    bgmHeld = true;
  }
  let apologyRetry = null;
  function clearApologyRetry() {
    if (!apologyRetry) return;
    removeEventListener("pointerdown", apologyRetry, true);
    apologyRetry = null;
  }
  function stopVoice() {
    voiceGen++;
    voiceScreen = 0;
    cancelAnimationFrame(voiceRaf);
    voiceRaf = 0;
    clearApologyRetry();
    voice.pause();
    duck(false);
    releaseMusic();
  }
  function startReading(id) {
    const s = spoken[id];
    const gen = ++voiceGen;
    voiceScreen = id;
    cancelAnimationFrame(voiceRaf);
    userScrolledVoice = false;
    screens[id].scrollTop = 0;
    s.lines.forEach((line) => { line.shown = false; line.el.classList.remove("is-in"); });
    void s.body.offsetWidth;
    s.path.style.strokeDashoffset = "1";
    const dur = id === 6 ? 26000 : READ_MS;
    if (reduced()) {
      s.lines.forEach((line) => { line.shown = true; line.el.classList.add("is-in"); });
      s.path.style.strokeDashoffset = "0";
      return;
    }
    const t0 = performance.now();
    const step = (now) => {
      if (gen !== voiceGen || state.screen !== id) return;
      const prog = Math.min(1, (now - t0) / dur);
      paintVoice(prog);
      if (prog < 1) voiceRaf = requestAnimationFrame(step);
    };
    voiceRaf = requestAnimationFrame(step);
  }
  function buildPromise() {
    const line = $("#promiseLine");
    if (line.childElementCount) return;
    PROMISE_CUES.forEach(([at, word]) => {
      const el = document.createElement("span");
      el.className = "w";
      el.dataset.at = String(at);
      el.textContent = word;
      line.appendChild(el);
    });
  }
  function resetPromise() {
    $$(".w", $("#promiseLine")).forEach((el) => {
      el.classList.remove("is-on", "is-now");
      el.getAnimations().forEach((a) => a.cancel());
    });
  }
  function showWord(el) {
    el.classList.add("is-on");
    if (reduced()) return;
    el.animate(
      [
        { opacity: 0, transform: "translateY(.4em) scale(.78)", filter: "blur(8px)" },
        { opacity: 1, transform: "translateY(0) scale(1.14)", filter: "blur(0px)", offset: .58 },
        { opacity: 1, transform: "none", filter: "none" },
      ],
      { duration: 680, easing: "cubic-bezier(.22,1,.36,1)", fill: "backwards" },
    );
  }
  function startApology() {
    buildPromise();
    const gen = ++voiceGen;
    voiceScreen = 5;
    cancelAnimationFrame(voiceRaf);
    resetPromise();
    holdMusic();
    const words = $$(".w", $("#promiseLine"));
    const begin = () => {
      if (gen !== voiceGen || state.screen !== 5) return;
      if (reduced()) words.forEach((el) => el.classList.add("is-on"));
      voice.currentTime = 0;
      const step = () => {
        if (gen !== voiceGen || state.screen !== 5) return;
        const t = voice.ended ? 1e9 : voice.currentTime + 0.05;
        let current = -1;
        words.forEach((el, i) => {
          if (t < +el.dataset.at) return;
          if (!el.classList.contains("is-on")) showWord(el);
          current = i;
        });
        words.forEach((el, i) => el.classList.toggle("is-now", i === current && !voice.ended));
        if (!voice.ended && !voice.paused) voiceRaf = requestAnimationFrame(step);
      };
      const arm = () => {
        clearApologyRetry();
        apologyRetry = () => {
          if (gen !== voiceGen || state.screen !== 5) { clearApologyRetry(); return; }
          voice.play().then(() => {
            clearApologyRetry();
            if (gen !== voiceGen) { voice.pause(); return; }
            voiceRaf = requestAnimationFrame(step);
          }).catch(() => {});
        };
        addEventListener("pointerdown", apologyRetry, true);
      };
      voice.play().then(() => {
        if (gen !== voiceGen) { voice.pause(); return; }
        voiceRaf = requestAnimationFrame(step);
      }).catch(arm);
    };
    if (voice.readyState >= 1) begin();
    else voice.addEventListener("loadedmetadata", begin, { once: true });
  }
  [4, 6].forEach((id) => {
    ["wheel", "touchmove"].forEach((ev) => {
      screens[id].addEventListener(ev, () => { userScrolledVoice = true; }, { passive: true });
    });
  });

  function buildPayoff() {
    const el = $("#payoff");
    el.textContent = "";
    const ln = document.createElement("span");
    ln.className = "ln";
    const inner = document.createElement("span");
    inner.className = "ln__in";
    inner.style.display = "none";
    richText(inner, CONFIG.screens.letter.knot);
    ln.appendChild(inner);
    el.appendChild(ln);
  }
  function setLetterDone() {
    letterTimers.forEach(clearTimeout);
    letterTimers = [];
    letterAnims.forEach((a) => a.cancel());
    letterAnims = [];
    finaleOn = true;
    finale.classList.add("is-on");
    state.letterRead = true;
  }
  function finishLetter() {
    if (!letterAnims.length) return;
    letterAnims.forEach((a) => { if (a.playState !== "finished") a.finish(); });
  }
  function revealLetter(base) {
    if (state.letterRead || reduced()) { setLetterDone(); return; }
    if (letterAnims.length) return;
    userScrolled = false;
    let t = base;
    const later = (fn, ms) => letterTimers.push(setTimeout(fn, ms));
    const add = (el, kf, dur, delay, easing = EASE_OUT) => {
      letterAnims.push(el.animate(kf, { duration: dur, delay, easing, fill: "backwards" }));
    };
    const rise = [{ transform: "translateY(105%)" }, { transform: "none" }];
    $$(".ln__in", $("#s3-title")).forEach((ln) => {
      add(ln, rise, 850, t);
      t += 220;
    });
    const bodyStart = t + 180;
    t = bodyStart;
    $$("p", letterBody).forEach((p) => {
      const at = t;
      later(() => {
        if (userScrolled || state.screen !== 3) return;
        const r = p.getBoundingClientRect();
        const ch = screens[3].clientHeight;
        if (r.bottom > ch * .82) screens[3].scrollBy({ top: r.bottom - ch * .55, behavior: "smooth" });
      }, at);
      $$(".ln__in", p).forEach((ln) => {
        add(ln, rise, 850, t);
        t += 170 + ln.textContent.trim().split(/\s+/).length * 105;
      });
      t += 280;
    });
    add(thread, [{ strokeDasharray: "1 1", strokeDashoffset: 1 }, { strokeDasharray: "1 1", strokeDashoffset: 0 }], Math.max(400, t - bodyStart), bodyStart, "linear");
    add($("#sign"), [{ opacity: 0, transform: "translateY(16px)" }, { opacity: 1, transform: "none" }], 900, t);
    later(() => playFinale(false), t + 900);
  }
  function playFinale(instant) {
    if (finaleOn) return;
    finaleOn = true;
    finale.classList.add("is-on");
    if (instant || reduced()) { setLetterDone(); return; }
    const sc = screens[3];
    const r = finale.getBoundingClientRect();
    if (r.bottom > sc.clientHeight) sc.scrollBy({ top: r.top - sc.clientHeight * .18, behavior: "smooth" });
    const add = (el, kf, dur, delay, easing = EASE_OUT) => {
      letterAnims.push(el.animate(kf, { duration: dur, delay, easing, fill: "backwards" }));
    };
    const later = (fn, ms) => letterTimers.push(setTimeout(fn, ms));
    add($("#knotPath"), [{ strokeDasharray: "1 1", strokeDashoffset: 1 }, { strokeDasharray: "1 1", strokeDashoffset: 0 }], 1700, 250, EASE_IO);
    add($("#knotG"), [{ transform: "scale(1.14) translateY(-6px)" }, { transform: "none" }], 1100, 1850, SPRING);
    add($("#knotGlow"), [{ opacity: 0, transform: "scale(.3)" }, { opacity: 1, transform: "scale(.9)", offset: .3 }, { opacity: .35, transform: "scale(1.5)" }], 1800, 1850, EASE_OUT);
    $$(".knot-name").forEach((n, i) => add(n, [{ opacity: 0, transform: `translateX(${i ? 14 : -14}px)` }, { opacity: 1, transform: "none" }], 900, 300 + i * 120));
    $$(".ln__in", $("#payoff")).forEach((ln, i) => add(ln, [{ transform: "translateY(110%)" }, { transform: "none" }], 1100, 2050 + i * 120));
    later(() => {
      const r2 = finale.getBoundingClientRect();
      if (r2.bottom > sc.clientHeight && !userScrolled) sc.scrollBy({ top: r2.bottom - sc.clientHeight + 40, behavior: "smooth" });
    }, 2700);
    later(setLetterDone, 3800);
  }
  letterEl.addEventListener("click", () => { finishLetter(); setLetterDone(); });
  ["wheel", "touchmove", "keydown"].forEach((ev) => {
    screens[3].addEventListener(ev, () => { userScrolled = true; }, { passive: true });
  });
  $("#signName").textContent = CONFIG.names.him;
  $("#knotHim").textContent = CONFIG.names.him;
  $("#knotHer").textContent = CONFIG.names.her;
  buildPayoff();
  buildLetter();
  buildSpoken(4);
  buildSpoken(6);
  buildPromise();
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => {
      if (!letterAnims.length || state.letterRead) buildLetter();
      if (state.screen !== 4) buildSpoken(4);
      if (state.screen !== 6) buildSpoken(6);
    });
  }
  let letterResize = 0;
  addEventListener("resize", () => {
    clearTimeout(letterResize);
    letterResize = setTimeout(() => {
      if (!letterAnims.length || state.letterRead) buildLetter();
      if (state.screen !== 4) buildSpoken(4);
      if (state.screen !== 6) buildSpoken(6);
    }, 150);
  });

  /* ---------- ambient: slow gold dust ---------- */
  (function sky() {
    const c = $("#sky"), ctx = c.getContext("2d");
    let w = 0, h = 0, parts = [], raf = 0;
    const COLORS = ["#B48A4E", "#B48A4E", "#C98F86"];
    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = innerWidth; h = innerHeight;
      c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const count = Math.round(Math.min(28, (w * h) / 26000));
      parts = Array.from({ length: count }, () => ({
        x: Math.random() * w, y: Math.random() * h,
        r: .7 + Math.random() * 1.7, vy: -(.06 + Math.random() * .2), vx: (Math.random() - .5) * .1,
        a: .18 + Math.random() * .38, ph: Math.random() * 6.28, c: COLORS[(Math.random() * COLORS.length) | 0],
      }));
    }
    function frame(t) {
      ctx.clearRect(0, 0, w, h);
      for (const p of parts) {
        p.x += p.vx + Math.sin(t / 2600 + p.ph) * .07;
        p.y += p.vy;
        if (p.y < -8) { p.y = h + 8; p.x = Math.random() * w; }
        ctx.globalAlpha = p.a * (.65 + .35 * Math.sin(t / 1100 + p.ph));
        ctx.fillStyle = p.c;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
      }
      raf = requestAnimationFrame(frame);
    }
    const start = () => { if (!raf && !reduced() && !document.hidden) raf = requestAnimationFrame(frame); };
    const stop = () => { cancelAnimationFrame(raf); raf = 0; };
    let rt;
    addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(resize, 150); });
    document.addEventListener("visibilitychange", () => (document.hidden ? stop() : start()));
    mqReduce.addEventListener("change", () => { if (reduced()) { stop(); ctx.clearRect(0, 0, w, h); } else start(); });
    resize(); start();
  })();

  /* ---------- boot ---------- */
  if (!location.hash) history.replaceState(null, "", "#1");
  const first = parseHash();
  if (first > 1) state.sealBroken = true; // landed deep: the envelope is already open
  show(first, { instant: true });
})();
</script>
</body>
</html>

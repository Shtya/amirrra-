<!doctype html>
<html lang="ar-EG" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F1E5D7">
<meta name="color-scheme" content="light">
<title>الخيط</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Aref+Ruqaa:wght@700&display=swap" rel="stylesheet">

<script>
/* ==========================================================================
   CONFIG — كل النصوص والإعدادات هنا. عدّل هنا بس.
   {her} و {him} بيتبدلوا بالأسماء. *كلمة* بين نجمتين بتطلع باللون الأحمر.
   ========================================================================== */
const CONFIG = {
  names: { her: "أميرة", him: "أحمد" },

  // [خصّص] رقمك بصيغة دولية من غير + ومن غير مسافات. مثال: 2010xxxxxxxx
  // لو فاضي، زرار «خلينا نتكلم؟» بيتحول لـ «انسخي الرسالة».
  whatsappNumber: "",

  // الرسالة اللي بتظهر جاهزة في واتساب (أو بتتنسخ). هي تقدر تعدّلها قبل ما تبعت.
  whatsappMessage: "{him}، قريت الجواب. تعالى نتكلم.", // TODO: خصّص

  screens: {
    intro: {
      eyebrow: "من {him}، لـ{her}",
      title: ["فيه *خيط*", "بيني", "وبينك."],                       // كل عنصر = سطر. TODO: خصّص
      subtitle: "عارف إني شدّيته زيادة عن اللزوم. المرة دي الطرف في إيدك.", // TODO: خصّص
      handleLabel: "اسحبي طرف الخيط لتحت عشان نبدأ",
      hint: "اسحبي الطرف لتحت",
      reopen: "ارجعي للعُقد",
    },
    notes: {
      eyebrow: "قبل الجواب",
      title: "تلات *عُقد*",
      subtitle: "في كل عقدة حاجة كان نفسي أقولهالك. وعدت نفسي ماكتبش أكتر من تلات سطور، وكان صعب.", // TODO: خصّص
      done: "اتفكّت",
      tapAlt: "أو دوسي مرة واحدة وهي تكمّل لوحدها",
      progress: ["لسه ولا عقدة اتفكّت", "فكّيتي واحدة", "فكّيتي اتنين", "فكّيتي التلاتة"],
      locked: ["", "فاضل عقدة", "فاضل عقدتين", "فاضل تلات عُقد"],
      ready: "يلا على الجواب",
      nudge: "فيه عقدة لسه مربوطة. ولو حابة تعدّي، الزرار اللي تحت موجود.",
      skip: "أكمّل من غير ما أفكّهم كلهم",
    },
    letter: {
      eyebrow: "الجواب",
      showAll: "اعرضيه كله",
      salutation: "{her}،",
      closing: "بحبك،",
      knot: "ولسه *ماتقطعش.*",   // السطر اللي بيظهر مع العقدة في الآخر
      talk: "خلينا نتكلم؟",
      copy: "انسخي الرسالة",
      copied: "اتنسخت",
      time: "محتاجة وقت؟ خدي وقتك",
      talkReply: "واتساب هيفتح والرسالة جاهزة. غيّري فيها براحتك قبل ما تبعتي.",
      copyReply: "الرسالة معاكي. ابعتيها بس لما تحسي إنك عايزة، وغيّري فيها اللي يعجبك.",
      copyFail: "ماعرفتش أنسخها لوحدي، دي هي لو حبيتي تنسخيها:",
      timeReply: "ولا يهمك. أنا مستني وقت ما تحبي، ومن غير زنّ.",
    },
    sound: { off: "شغّلي الصوت", on: "اقفلي الصوت" },
  },

  // التلات عُقد. كل واحدة بتتفك بطريقة مختلفة (سحب / ضغط مطوّل / تخييط).
  items: [
    {
      label: "حاجة بحبها فيكي",
      gesture: "اسحبي الخرزة لحد العقدة",
      // TODO: خصّص — [حاجة حقيقية بتحبها فيها، تفصيلة صغيرة أحسن من جملة كبيرة]
      text: "ضحكتك لما تيجي فجأة في نص الكلام، قبل ما تلحقي تمسكيها.",
    },
    {
      label: "حاجة فاكرها",
      gesture: "اضغطي على البكرة ومتشيليش صباعك",
      // TODO: خصّص — [ذكرى حقيقية بينا في سطر]. النص ده عام عن قصد، بدّله بذكرى بجد.
      text: "أول مرة حسيت إن الكلام معاكي مش محتاج تحضير. لسه فاكر الإحساس ده كويس.",
    },
    {
      label: "مكانك عندي",
      gesture: "خيّطي النقط ببعض",
      // TODO: خصّص
      text: "إنتِ أول حد بفكر أحكيله لما يحصل أي حاجة، حلوة أو وحشة. ودي حاجة مابتتغيرش لما نكون زعلانين.",
    },
  ],

  // الاعتذار — فقرات قصيرة بتظهر سطر سطر. خليه أقل من ٩٠ كلمة.
  apology: [
    "أنا زعّلتك، ومش هقول إنك فهمتيني غلط. اللي حصل ماكانش ينفع، وأنا اللي عملته.",
    // TODO: خصّص — [سطر بيسمّي اللي حصل بالظبط، من غير تبرير]
    "وكان المفروض آخد بالي قبل ما الموضوع يوصل للنقطة دي.",
    "مش عايزك تعدّي الموضوع عشان خاطري. عايزك تعرفي إني فاهم إنتِ زعلانة ليه.",
    // TODO: خصّص — التزام صغير ومحدد تقدر تنفذه فعلًا
    "ومن هنا ورايح، لما حاجة تضايقك هسمعك للآخر قبل ما أرد، حتى لو عندي كلام كتير.",
    "ولما تكوني عايزة نتكلم، أنا موجود.",
  ],
};
</script>

<style>
/* ========================================================================
   Tokens
   ======================================================================== */
:root{
  /* palette — linen, bone, espresso ink, pomegranate thread, saffron light */
  --linen:#F1E5D7;
  --bone:#FAF3EA;
  --ink:#2A1C18;
  --thread:#BF2A2A;
  --saffron:#D8963A;
  --ink-soft:#66504A;              /* ink at reduced strength, 6:1 on linen */
  --hair:rgba(42,28,24,.10);
  --hair-thread:rgba(191,42,42,.28);

  --s-1:.25rem; --s-2:.5rem; --s-3:.75rem; --s-4:1rem; --s-5:1.5rem; --s-6:2rem; --s-7:3.5rem; --s-8:6rem;
  --gutter:1.25rem;
  --r-md:14px; --r-lg:22px; --r-pill:999px;

  --sh-1:0 1px 1px rgba(60,30,20,.06),0 6px 14px -6px rgba(60,30,20,.16),0 24px 44px -24px rgba(60,30,20,.30);
  --sh-bead:inset 0 2px 2px rgba(255,190,170,.45),inset 0 -4px 8px rgba(80,8,8,.35),0 3px 4px rgba(90,15,15,.25),0 12px 22px -8px rgba(150,25,25,.5);

  --ease-out:cubic-bezier(.16,1,.3,1);
  --ease-io:cubic-bezier(.76,0,.24,1);
  --spring:linear(0,.009,.035 2.1%,.141,.281 6.7%,.723 12.9%,.938 16.7%,1.017,1.077,1.121,1.149 24.3%,1.159,1.163,1.161,1.154 29.9%,1.129 32.8%,1.051 39.6%,1.017 43.1%,.991,.977 51%,.974 53.8%,.975 57.1%,.997 69.8%,1.003 76.9%,1.004 83.8%,1);

  --f-display:"Reem Kufi","IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  --f-hand:"Aref Ruqaa","Traditional Arabic","Amiri",serif;

  --fs-sm:1rem;
  --fs-base:clamp(1.0625rem,1rem + .3vw,1.1875rem);
  --fs-md:clamp(1.2rem,1.06rem + .7vw,1.5rem);
  --fs-lg:clamp(1.9rem,1.3rem + 3vw,3.2rem);
  --fs-xl:clamp(2.6rem,1.6rem + 5.5vw,5.2rem);
  --fs-mega:clamp(3.6rem,1.2rem + 13vw,10rem);
}

/* ========================================================================
   Base
   ======================================================================== */
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
html{-webkit-text-size-adjust:100%;background:var(--linen)}
body{
  margin:0;background:var(--linen);color:var(--ink);
  font-family:var(--f-body);font-size:var(--fs-base);line-height:1.85;
  overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
}
body::after{ /* grain */
  content:"";position:fixed;inset:0;pointer-events:none;z-index:60;opacity:.2;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .32  0 0 0 0 .2  0 0 0 0 .14  0 0 0 .6 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--thread);outline-offset:4px;border-radius:6px}
.sr{position:absolute!important;inline-size:1px;block-size:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
em{font-style:normal;color:var(--thread)}

/* ========================================================================
   Screens + atmosphere
   ======================================================================== */
.screen{
  position:fixed;inset:0;z-index:1;
  display:flex;flex-direction:column;
  overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;
  background:var(--linen);visibility:hidden;
}
.screen.is-active,.screen.is-leaving{visibility:visible}
.screen.is-leaving{z-index:2}
.screen.is-active{z-index:3}
.screen.is-top{z-index:4}

.atmos{position:sticky;top:0;flex:none;block-size:100dvh;margin-block-end:-100dvh;overflow:hidden;pointer-events:none;z-index:0}
.atmos::after{ /* hairline frame */
  content:"";position:absolute;inset:10px;border-radius:var(--r-lg);
  box-shadow:inset 0 0 0 1px var(--hair);
}
.leak{
  position:absolute;border-radius:50%;
  transform:translate3d(calc(var(--px,0) * var(--d) * 1px),calc(var(--py,0) * var(--d) * 1px),0);
  transition:transform 1.4s var(--ease-out);
}
.leak i{
  position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(closest-side,var(--c),transparent 72%);
  animation:drift var(--t,18s) ease-in-out infinite alternate;
}
@keyframes drift{to{transform:translate(var(--dx,4%),var(--dy,6%)) scale(1.14)}}
.leak--a{--c:rgba(216,150,58,.42);--d:-26;inline-size:85vmax;block-size:85vmax;inset-block-start:-38vmax;inset-inline-end:-30vmax}
.leak--b{--c:rgba(191,42,42,.13);--d:34;inline-size:70vmax;block-size:70vmax;inset-block-end:-34vmax;inset-inline-start:-26vmax;--t:22s;--dx:-5%;--dy:-4%}
.leak--c{--c:rgba(232,170,140,.34);--d:16;inline-size:48vmax;block-size:48vmax;inset-block-start:30%;inset-inline-start:20%;--t:26s}
.s2 .leak--a{inset-block-start:10%;inset-inline-end:-40vmax}
.s2 .leak--c{inset-block-start:-20%;inset-inline-start:-10%}
.s3 .leak--a{--c:rgba(216,150,58,.30);inset-block-start:-45vmax;inset-inline-end:-10vmax}
.s3 .leak--b{--c:rgba(191,42,42,.09)}

.stage{
  position:relative;z-index:1;inline-size:100%;max-inline-size:var(--max,38rem);
  margin-inline:auto;margin-block:auto;
  padding-block:max(var(--s-6),env(safe-area-inset-top)) max(var(--s-6),env(safe-area-inset-bottom));
  padding-inline:max(var(--gutter),env(safe-area-inset-right)) max(var(--gutter),env(safe-area-inset-left));
}

/* type */
.mega{font-family:var(--f-display);font-weight:700;font-size:var(--fs-mega);line-height:.98;margin:0;color:var(--ink)}
.xl{font-family:var(--f-display);font-weight:700;font-size:var(--fs-xl);line-height:1.05;margin:0}
.ln{display:block;overflow:hidden;padding-block:.14em .08em;margin-block:-.08em}
.ln__in{display:block}
.eyebrow{display:inline-flex;align-items:center;gap:.7em;margin:0;font-size:var(--fs-sm);font-weight:500;color:var(--ink-soft)}
.eyebrow::before{content:"";inline-size:2.25rem;block-size:1.5px;background:var(--thread);border-radius:2px}
.lede{font-size:var(--fs-md);line-height:1.75;color:var(--ink-soft);margin:0;text-wrap:pretty}

/* chrome */
.sound{
  position:fixed;z-index:40;
  inset-block-start:max(14px,env(safe-area-inset-top));inset-inline-end:max(14px,env(safe-area-inset-left));
  inline-size:48px;block-size:48px;border-radius:50%;border:0;cursor:pointer;
  display:grid;place-items:center;color:var(--ink-soft);
  background:rgba(250,243,234,.72);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  box-shadow:inset 0 0 0 1px var(--hair),0 6px 16px -10px rgba(60,30,20,.4);
  transition:transform .3s var(--ease-out),color .3s;
}
.sound svg{inline-size:22px;block-size:22px}
.sound:hover{color:var(--thread)}
.sound:active{transform:scale(.92)}
.sound[aria-pressed="true"]{color:var(--thread)}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:var(--s-3);min-block-size:48px;margin-block-end:var(--s-6);padding-inline-end:56px}
.back{
  display:inline-flex;align-items:center;gap:.4em;min-block-size:48px;padding-inline:var(--s-2) var(--s-3);
  margin-inline-start:calc(var(--s-2) * -1);border:0;background:none;cursor:pointer;border-radius:var(--r-pill);
  color:var(--ink-soft);font-size:var(--fs-sm);transition:color .25s,background-color .25s,transform .25s var(--ease-out);
}
.back svg{inline-size:20px;block-size:20px;transition:transform .4s var(--ease-out)}
.back:hover{color:var(--thread);background:rgba(191,42,42,.06)}
.back:hover svg{transform:translateX(3px)}
.back:active{transform:scale(.96)}

.btn{
  position:relative;display:inline-flex;align-items:center;justify-content:center;gap:.6em;
  min-block-size:56px;padding-inline:var(--s-6);border:0;border-radius:var(--r-pill);cursor:pointer;
  font-weight:600;font-size:var(--fs-base);line-height:1.2;text-decoration:none;user-select:none;-webkit-user-select:none;
  transition:transform .3s var(--ease-out),box-shadow .4s var(--ease-out),background-color .4s,color .4s;
}
.btn svg{inline-size:18px;block-size:18px;transition:transform .4s var(--ease-out)}
.btn--thread{color:#FBF1E8;background:var(--thread);box-shadow:inset 0 1px 0 rgba(255,200,190,.35),0 2px 3px rgba(120,20,20,.2),0 14px 28px -12px rgba(191,42,42,.6)}
@media (hover:hover){.btn--thread:hover{transform:translateY(-2px)}.btn--thread:hover svg{transform:translateX(-4px)}}
.btn--thread:active{transform:translateY(1px) scale(.98)}
.btn--thread[aria-disabled="true"]{color:var(--ink-soft);background:rgba(250,243,234,.6);box-shadow:inset 0 0 0 1.5px var(--hair)}
.btn--thread[aria-disabled="true"]::after{content:"";position:absolute;inset:0;border-radius:inherit;border:1.5px dashed var(--hair-thread)}
@media (hover:hover){.btn--thread[aria-disabled="true"]:hover{transform:none}}
.link{
  display:inline-flex;align-items:center;min-block-size:48px;padding-inline:var(--s-3);border:0;background:none;cursor:pointer;
  color:var(--thread);font-size:var(--fs-sm);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.45em;
  text-decoration-color:var(--hair-thread);transition:text-decoration-color .3s;
}
.link:hover{text-decoration-color:var(--thread)}

/* mask-reveal ring that rides the clip edge between screens */
#ring{position:fixed;inset:0;inline-size:100%;block-size:100%;pointer-events:none;z-index:50;overflow:visible}
#ringC{fill:none;stroke:var(--thread);stroke-width:1.6;vector-effect:non-scaling-stroke;transform-box:view-box;opacity:0}

/* ========================================================================
   Screen 1 — pull the thread
   ======================================================================== */
.s1 .stage{--max:68rem;display:flex;flex-direction:column;gap:var(--s-5);align-items:flex-start}
.s1 .mega{margin-block-start:var(--s-6)}
.s1 .lede{max-inline-size:min(21em,78%)}
.t1{position:absolute;inset:0;inline-size:100%;block-size:100%;pointer-events:none;z-index:2;overflow:visible}
#t1path{fill:none;stroke:var(--thread);stroke-width:2.2;stroke-linecap:round}
.handle{
  position:absolute;left:0;top:0;z-index:3;margin:-32px 0 0 -32px;
  inline-size:64px;block-size:64px;border:0;padding:0;background:none;border-radius:50%;
  cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
}
.handle:active{cursor:grabbing}
.handle__bead{
  position:absolute;inset:14px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#E8665A,var(--thread) 55%,#861B1B);box-shadow:var(--sh-bead);
  transition:transform .5s var(--spring);
}
.handle__bead::after{content:"";position:absolute;inset:38%;border-radius:50%;background:rgba(60,8,8,.45);box-shadow:0 1px 0 rgba(255,190,170,.4)}
.handle::before{
  content:"";position:absolute;inset:6px;border-radius:50%;border:1.5px solid var(--hair-thread);
  animation:pulse 2.6s var(--ease-out) infinite;
}
@keyframes pulse{0%{transform:scale(.7);opacity:0}30%{opacity:1}100%{transform:scale(1.5);opacity:0}}
@media (hover:hover){.handle:hover .handle__bead{transform:scale(1.12)}}
.is-pulling .handle__bead{transform:scale(1.18)}
.is-pulling .handle::before,.is-pulled .handle,.is-pulled .handle-label{animation:none;opacity:0;pointer-events:none}
.handle-label{
  position:absolute;left:0;top:0;z-index:3;white-space:nowrap;pointer-events:none;
  font-size:var(--fs-sm);font-weight:500;color:var(--thread);
  display:flex;align-items:center;gap:.5em;transition:opacity .3s;
}
.handle-label svg{inline-size:18px;block-size:18px;animation:bob 1.8s var(--ease-io) infinite}
@keyframes bob{50%{transform:translateY(5px)}}
.is-pulling .handle-label{opacity:0}
.s1__foot{min-block-size:56px}

/* ========================================================================
   Screen 2 — three knots
   ======================================================================== */
.s2 .stage{--max:58rem;padding-block-end:0}
.s2__head{display:flex;flex-direction:column;gap:var(--s-4);align-items:flex-start;max-inline-size:34rem}
.track{position:relative;display:flex;flex-direction:column;margin-block-start:var(--s-6);padding-block:var(--s-5) var(--s-7)}
.t2{position:absolute;inset:0;inline-size:100%;block-size:100%;overflow:visible;pointer-events:none;z-index:0}
#t2ghost{fill:none;stroke:var(--hair-thread);stroke-width:1.5;stroke-dasharray:1.5 8;stroke-linecap:round}
#t2live{fill:none;stroke:var(--thread);stroke-width:2;stroke-linecap:round}

.station{position:relative;z-index:1;display:flex;flex-direction:column;gap:var(--s-4);inline-size:min(100%,27rem);padding-block:var(--s-7)}
.st--1{align-self:flex-start}
.st--2{align-self:flex-end}
.st--3{align-self:center;align-items:center;text-align:center}
.st-num{
  position:absolute;z-index:-1;inset-block-start:-.18em;inset-inline-end:-.08em;pointer-events:none;user-select:none;
  font-family:var(--f-display);font-weight:700;font-size:clamp(10rem,46vw,17rem);line-height:1;
  color:transparent;-webkit-text-stroke:1.2px rgba(191,42,42,.17);
}
.st--3 .st-num{inset-inline-end:auto;inset-inline-start:50%;translate:50% 0}
.st-head{display:flex;align-items:center;gap:var(--s-3)}
.st-knot{
  position:relative;flex:none;inline-size:22px;block-size:22px;border-radius:50%;
  background:var(--linen);box-shadow:inset 0 0 0 2px var(--thread);
  transition:background-color .5s var(--ease-out);
}
.st-knot i{position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 1.5px var(--thread);opacity:0}
.is-done .st-knot{background:var(--thread)}
.st-tag{font-size:var(--fs-sm);font-weight:500;color:var(--thread);line-height:1.5;display:inline-flex;align-items:center;gap:.4em}
.st-tag svg{inline-size:18px;block-size:18px}
.st-title{font-family:var(--f-display);font-weight:700;font-size:var(--fs-lg);line-height:1.12;margin:0}
.st-body{overflow:hidden;padding-block:.1em}
.st-text{margin:0;font-size:var(--fs-md);line-height:1.8;text-wrap:pretty;max-inline-size:24em}
.is-done .st-text{transition:clip-path .7s var(--ease-out),filter .7s var(--ease-out),opacity .7s,transform 1.2s var(--spring)}
.st--1:not(.is-done) .st-text{clip-path:inset(0 0 0 100%)}
.st--2:not(.is-done) .st-text{filter:blur(9px);opacity:.14}
.st--3:not(.is-done) .st-text{transform:translateY(110%)}
.is-pre [data-st]{opacity:0}

/* widget 1 — bead on a thread */
.bead-wrap{position:relative;block-size:64px;inline-size:min(100%,21rem);touch-action:pan-y}
.bead-line{position:absolute;inset-inline:26px;top:50%;border-top:1.5px dashed var(--hair-thread)}
.bead-fill{position:absolute;inset-inline-start:26px;top:calc(50% - 1px);block-size:2px;inline-size:calc(100% - 52px);background:var(--thread);transform-origin:100% 50%;transform:scaleX(0)}
.bead-end{position:absolute;inset-inline-end:8px;top:50%;inline-size:36px;block-size:36px;margin-top:-18px;color:var(--thread);transition:transform .8s var(--spring),opacity .5s}
.is-done .bead-end{transform:scale(0) rotate(90deg);opacity:0}
.bead{
  position:absolute;inset-inline-start:0;top:50%;margin-top:-26px;inline-size:52px;block-size:52px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#E8665A,var(--thread) 55%,#861B1B);box-shadow:var(--sh-bead);
  cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;
}
.bead::after{content:"";position:absolute;inset:40%;border-radius:50%;background:rgba(60,8,8,.45)}
.bead:active{cursor:grabbing}
.bead:focus-visible{outline-offset:5px;border-radius:50%}

/* widget 2 — spool, hold to wind */
.spool{
  position:relative;inline-size:128px;block-size:128px;border:0;padding:0;background:none;border-radius:50%;cursor:pointer;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  transition:transform .4s var(--spring);
}
.spool:active{transform:scale(.95)}
.spool svg{inline-size:100%;block-size:100%;overflow:visible}
.spool:focus-visible{border-radius:50%}
#spool-disc,#spool-wound{transform-box:fill-box;transform-origin:center}
#spool-prog{transform:rotate(-90deg);transform-origin:64px 64px}

/* widget 3 — stitch the house */
.stitch{display:block;inline-size:min(100%,19rem);aspect-ratio:300/140;border:0;padding:0;background:none;cursor:crosshair;touch-action:none;border-radius:var(--r-md);user-select:none;-webkit-user-select:none}
.stitch svg{inline-size:100%;block-size:100%;overflow:visible}
.stitch .dot{fill:var(--linen);stroke:var(--thread);stroke-width:2;transform-box:fill-box;transform-origin:center;transition:fill .3s}
.stitch .dot.on{fill:var(--thread)}

/* dock */
.dock{
  position:sticky;bottom:0;z-index:5;
  margin-inline:calc(max(var(--gutter),env(safe-area-inset-right)) * -1) calc(max(var(--gutter),env(safe-area-inset-left)) * -1);
  padding:var(--s-7) var(--gutter) max(var(--s-4),env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--linen) 58%,rgba(241,229,215,0));
  display:flex;flex-direction:column;align-items:center;gap:var(--s-2);
}
.progress{display:flex;align-items:center;gap:var(--s-3);margin:0;font-size:var(--fs-sm);color:var(--ink-soft)}
.knots{position:relative;display:flex;gap:16px}
.knots::before{content:"";position:absolute;inset-inline:6px;top:50%;border-top:1.5px dashed var(--hair-thread)}
.knots i{position:relative;inline-size:12px;block-size:12px;border-radius:50%;background:var(--linen);box-shadow:inset 0 0 0 1.5px var(--thread);transition:background-color .4s,transform .6s var(--spring)}
.knots i.on{background:var(--thread);transform:scale(1.15)}
.dock .btn{min-inline-size:min(100%,18rem)}

@media (min-width:56rem){
  .station{inline-size:min(100%,30rem)}
  .st--1{margin-inline-start:4%}
  .st--2{margin-inline-end:4%;align-items:flex-end;text-align:end}
  .st--2 .st-head{flex-direction:row-reverse}
  .st--2 .st-num{inset-inline-end:auto;inset-inline-start:-.08em}
}

/* ========================================================================
   Screen 3 — the letter and the knot
   ======================================================================== */
.s3 .stage{--max:42rem}
.s3 .topbar .link{min-block-size:48px}
.salute{color:var(--thread);margin-block-end:var(--s-6)}
.letter-body{position:relative;padding-inline-start:var(--s-6)}
.t3{position:absolute;inset-block:0;inset-inline-start:0;inline-size:16px;block-size:100%;overflow:visible}
#t3path{fill:none;stroke:var(--thread);stroke-width:1.8;stroke-linecap:round}
.letter-body p{margin:0 0 var(--s-5);font-size:var(--fs-md);line-height:1.95}
.letter-body .ln{padding-block:0;margin-block:0}
.sign{display:flex;flex-direction:column;align-items:flex-end;margin-block-start:var(--s-6)}
.sign__close{color:var(--ink-soft);line-height:1.4}
.sign__name{font-family:var(--f-hand);font-weight:700;font-size:var(--fs-lg);color:var(--thread);line-height:1.5}

.finale{position:relative;margin-block:var(--s-7) var(--s-5);text-align:center}
.finale:not(.is-on),.after:not(.is-on){visibility:hidden}
.knot-svg{display:block;inline-size:100%;max-inline-size:28rem;margin-inline:auto;block-size:auto;overflow:visible}
#knotPath{fill:none;stroke:var(--thread);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
#knotG{transform-box:fill-box;transform-origin:50% 70%}
#knotGlow{transform-box:fill-box;transform-origin:center;opacity:0}
.knot-name{font-family:var(--f-hand);font-weight:700;font-size:22px;fill:var(--ink-soft)}
.payoff{margin-block-start:var(--s-3)}

.choices{display:grid;grid-template-columns:1fr;gap:var(--s-3)}
@media (min-width:44rem){.choices{grid-template-columns:1fr 1fr}}
.choice{
  display:flex;align-items:center;justify-content:center;gap:.6em;min-block-size:62px;padding:var(--s-3);
  border:0;border-radius:var(--r-md);cursor:pointer;text-decoration:none;text-align:center;
  font-weight:600;font-size:var(--fs-base);line-height:1.4;color:var(--thread);
  background:rgba(250,243,234,.85);box-shadow:inset 0 0 0 1.5px var(--hair-thread),var(--sh-1);
  transition:transform .3s var(--ease-out),box-shadow .4s var(--ease-out),background-color .4s,color .4s;
}
.choice svg{inline-size:20px;block-size:20px;flex:none;transition:transform .5s var(--spring)}
@media (hover:hover){.choice:hover{transform:translateY(-2px);box-shadow:inset 0 0 0 1.5px var(--thread),var(--sh-1)}.choice:hover svg{transform:scale(1.15) rotate(-8deg)}}
.choice:active{transform:translateY(1px) scale(.98)}
.choice[data-done="true"]{color:#FBF1E8;background:var(--thread)}
.reply{display:flex;gap:var(--s-3);align-items:flex-start;margin-block-start:var(--s-4);padding:var(--s-4) var(--s-5);border-radius:var(--r-md);background:rgba(250,243,234,.7);box-shadow:inset 0 0 0 1px var(--hair)}
.reply svg{inline-size:22px;block-size:22px;flex:none;margin-block-start:.35em;color:var(--thread)}
.reply p{margin:0;line-height:1.8}
.reply q{display:block;margin-block-start:var(--s-2);font-weight:600;color:var(--thread);quotes:"«" "»"}

.sweep{position:fixed;inset:0;z-index:45;pointer-events:none;opacity:0;background:linear-gradient(100deg,transparent 30%,rgba(216,150,58,.30) 46%,rgba(255,236,200,.35) 50%,transparent 66%)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .is-done .st-text{transition:opacity .4s!important}
}
</style>
</head>

<script>
(() => {
  "use strict";

  /* ---------------- helpers ---------------- */
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const root = document.documentElement;
  const mq = matchMedia("(prefers-reduced-motion: reduce)");
  const reduced = () => mq.matches;
  const EASE_OUT = "cubic-bezier(.16,1,.3,1)";
  const EASE_IO = "cubic-bezier(.76,0,.24,1)";
  const SPRING = getComputedStyle(root).getPropertyValue("--spring").trim() || EASE_OUT;
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));

  /* ======================================================================
     Screen 1 — the thread you pull
     ====================================================================== */
  const S1 = {
    el: screens[1], svg: $("#t1"), path: $("#t1path"), btn: $("#handle"), label: $("#handleLabel"),
    ax: 0, ay: -30, rx: 0, ry: 0, x: 0, y: 0, H: 0, TH: 120, drag: null, raf: 0, anim: 0, moved: false, just: false, tick: 0, ready: false,

  function smoothPath(pts) {

    tag.innerHTML = '<svg aria-hidden="true"><use href="#i-check"/></svg>';
    tag.appendChild(document.createTextNode(T("notes.done")));
    if (i === 0) { beadSet(1); B.bead.setAttribute("aria-valuetext", T("notes.done")); }
    if (i === 1) { spoolSet(1); P.btn.setAttribute("aria-expanded", "true"); }
    if (i === 2) { X.k = X.seq.length; stitchDraw(); X.btn.setAttribute("aria-expanded", "true"); }
    if (animate && !reduced()) {
      const k = S2.knots[i];
      k.animate([{ transform: "scale(.3)" }, { transform: "scale(1)" }], { duration: 900, easing: SPRING });
      $("i", k).animate([{ transform: "scale(1)", opacity: .9 }, { transform: "scale(3.4)", opacity: 0 }], { duration: 900, easing: EASE_OUT });
      S2.nums[i].animate([{ scale: "1" }, { scale: "1.06" }, { scale: "1" }], { duration: 900, easing: SPRING });
    }
  }
  function renderStations() {
    state.done.forEach((d, i) => { if (d) applyStation(i, false); });
    updateProgress(false);
  }

  /* --- 1: drag the bead to the knot --- */
  const B = { wrap: $("#beadWrap"), bead: $("#bead"), fill: $("#beadFill"), text: $("#st-text-0"), p: 0, travel: 0, drag: null, moved: false, just: false, tick: 0, busy: false };
  function beadLayout() { B.travel = Math.max(0, B.wrap.clientWidth - 52); beadSet(state.done[0] ? 1 : B.p); }
  function beadSet(p) {
    B.p = p;
    const q = clamp(p);
    B.bead.style.transform = `translateX(${(-p * B.travel).toFixed(1)}px)`;
    B.fill.style.transform = `scaleX(${q.toFixed(3)})`;
    if (!state.done[0]) B.text.style.clipPath = `inset(0 0 0 ${((1 - q) * 100).toFixed(1)}%)`;
    B.bead.setAttribute("aria-valuenow", String(Math.round(q * 100)));
  }
  function beadTicks(p) { const s = Math.floor(clamp(p) * 5); if (s > B.tick) { sound.pluck(392 + s * 70); buzz(3); } B.tick = s; }
  async function beadAuto() {
    if (state.done[0] || B.busy) return;
    B.busy = true;
    const p0 = B.p;
    await tween(900, (t) => { const p = p0 + (1 - p0) * t; beadSet(p); beadTicks(p); });
    B.busy = false; B.tick = 0;
    complete(0);
  }
  async function beadBack() {
    const p0 = B.p;
    B.busy = true;
    await tween(800, (t) => beadSet(p0 * (1 - springEase(t))), (t) => t);
    beadSet(0); B.busy = false; B.tick = 0;
  }
  B.bead.addEventListener("pointerdown", (e) => {
    if (state.done[0] || B.busy) return;
    B.bead.setPointerCapture(e.pointerId);
    B.drag = { sx: e.clientX, p0: B.p }; B.moved = false;
  });
  B.bead.addEventListener("pointermove", (e) => {
    if (!B.drag) return;
    const dx = e.clientX - B.drag.sx;
    if (!B.moved && Math.abs(dx) > 5) B.moved = true;
    if (!B.moved || !B.travel) return;
    const p = clamp(B.drag.p0 - dx / B.travel);
    beadSet(p); beadTicks(p);
    if (p >= .985) { B.drag = null; B.just = true; B.tick = 0; beadSet(1); complete(0); }
  });
  const beadEnd = () => {
    if (!B.drag) return;
    B.drag = null;
    if (!B.moved) return;
    B.just = true;
    if (!state.done[0]) beadBack();
  };
  B.bead.addEventListener("pointerup", beadEnd);
  B.bead.addEventListener("pointercancel", beadEnd);
  B.bead.addEventListener("click", () => { if (B.just) { B.just = false; return; } beadAuto(); });
  B.bead.addEventListener("keydown", (e) => {
    if (state.done[0]) return;
    const k = e.key;
    let p = B.p;
    if (k === "ArrowLeft" || k === "ArrowUp") p += .1;
    else if (k === "ArrowRight" || k === "ArrowDown") p -= .1;
    else if (k === "Home") p = 0;
    else if (k === "End" || k === "Enter" || k === " ") { e.preventDefault(); beadAuto(); return; }
    else return;
    e.preventDefault();
    p = clamp(p); beadSet(p); beadTicks(p);
    if (p >= .99) complete(0);
  });

  /* --- 2: hold the spool to wind --- */
  const P = { btn: $("#spool"), prog: $("#spool-prog"), disc: $("#spool-disc"), wound: $("#spool-wound"), text: $("#st-text-1"), p: 0, raf: 0, t0: 0, holding: false, long: false, tick: 0, C: 2 * Math.PI * 58 };
  P.prog.style.strokeDasharray = `${P.C} ${P.C}`;
  function spoolSet(p) {
    P.p = p;
    P.prog.style.strokeDashoffset = (P.C * (1 - p)).toFixed(1);
    P.disc.style.transform = `rotate(${(p * 540).toFixed(1)}deg)`;
    P.wound.style.transform = `scale(${(.5 + .5 * p).toFixed(3)})`;
    if (!state.done[1]) {
      P.text.style.filter = `blur(${((1 - p) * 9).toFixed(2)}px)`;
      P.text.style.opacity = (.14 + .86 * p).toFixed(3);
    }
  }
  function spoolRun(dir, ms) {
    cancelAnimationFrame(P.raf);
    let last = performance.now();
    const step = (now) => {
      const dt = now - last; last = now;
      const p = clamp(P.p + dir * dt / ms);
      spoolSet(p);
      const s = Math.floor(p * 6);
      if (dir > 0 && s > P.tick) { sound.pluck(330 + s * 60); buzz(3); }
      P.tick = s;
      if (p >= 1) { P.raf = 0; complete(1); return; }
      if (p <= 0) { P.raf = 0; return; }
      P.raf = requestAnimationFrame(step);
    };
    P.raf = requestAnimationFrame(step);
  }
  P.btn.addEventListener("pointerdown", (e) => {
    if (state.done[1]) return;
    P.btn.setPointerCapture(e.pointerId);
    P.holding = true; P.long = false; P.t0 = performance.now();
    spoolRun(1, 1500);
  });
  const spoolEnd = () => {
    if (!P.holding) return;
    P.holding = false;
    if (state.done[1]) return;
    cancelAnimationFrame(P.raf); P.raf = 0;
    if (performance.now() - P.t0 >= 260) { P.long = true; spoolRun(-1, 700); }
  };
  P.btn.addEventListener("pointerup", spoolEnd);
  P.btn.addEventListener("pointercancel", spoolEnd);
  P.btn.addEventListener("contextmenu", (e) => e.preventDefault());
  P.btn.addEventListener("click", () => {
    if (P.long) { P.long = false; return; }
    if (state.done[1]) return;
    if (reduced()) { spoolSet(1); complete(1); return; }
    spoolRun(1, 800);
  });

  /* --- 3: stitch the little house («مكانك عندي») --- */
  const X = {
    btn: $("#stitch"), svg: $("#stitch svg"), dots: $$("#stitch .dot"), sewn: $("#stitchSewn"), line: $("#stitchLive"),
    pts: [[230, 120], [230, 64], [150, 18], [70, 64], [70, 120]], seq: [0, 1, 2, 3, 4, 0], k: 0, drag: false, moved: false, just: false, sx: 0, sy: 0, busy: false,
  };
  function toSvg(e) {
    const m = X.svg.getScreenCTM();
    if (!m) return { x: 0, y: 0 };
    const pt = X.svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    return pt.matrixTransform(m.inverse());
  }
  function stitchDraw() {
    const used = X.seq.slice(0, X.k);
    X.sewn.setAttribute("points", used.map((i) => X.pts[i].join(",")).join(" "));
    X.dots.forEach((d, i) => d.classList.toggle("on", used.includes(i)));
  }
  function stitchReach() {
    const idx = X.seq[X.k];
    X.k++;
    stitchDraw();
    if (!reduced()) X.dots[idx].animate([{ transform: "scale(1)" }, { transform: "scale(1.7)" }, { transform: "scale(1)" }], { duration: 600, easing: SPRING });
    sound.pluck(392 * Math.pow(1.125, X.k)); buzz(5);
    if (X.k >= X.seq.length) { X.line.setAttribute("opacity", "0"); complete(2); }
  }
  async function stitchAuto() {
    if (state.done[2] || X.busy) return;
    X.busy = true;
    while (X.k < X.seq.length) { stitchReach(); if (X.k < X.seq.length) await wait(reduced() ? 0 : 190); }
    X.busy = false;
  }
  X.btn.addEventListener("pointerdown", (e) => {
    if (state.done[2] || X.busy) return;
    X.btn.setPointerCapture(e.pointerId);
    X.drag = true; X.moved = false; X.sx = e.clientX; X.sy = e.clientY;
  });
  X.btn.addEventListener("pointermove", (e) => {
    if (!X.drag || state.done[2]) return;
    if (!X.moved && Math.hypot(e.clientX - X.sx, e.clientY - X.sy) > 6) { X.moved = true; if (X.k === 0) stitchReach(); }
    if (!X.moved) return;
    const p = toSvg(e);
    const last = X.pts[X.seq[X.k - 1]], next = X.pts[X.seq[X.k]];
    X.line.setAttribute("x1", last[0]); X.line.setAttribute("y1", last[1]);
    X.line.setAttribute("x2", p.x.toFixed(1)); X.line.setAttribute("y2", p.y.toFixed(1));
    X.line.setAttribute("opacity", ".55");
    if (next && Math.hypot(p.x - next[0], p.y - next[1]) < 26) stitchReach();
  });
  const stitchEnd = () => {
    if (!X.drag) return;
    X.drag = false;
    X.line.setAttribute("opacity", "0");
    if (X.moved) X.just = true;
  };
  X.btn.addEventListener("pointerup", stitchEnd);
  X.btn.addEventListener("pointercancel", stitchEnd);
  X.btn.addEventListener("click", () => { if (X.just) { X.just = false; return; } stitchAuto(); });

  /* --- progress & next --- */
  const next = $("#next"), skip = $("#skip");
  function updateProgress(animate) {
    const n = state.done.filter(Boolean).length;
    $("#progressText").textContent = names(raw("notes.progress")[n]);
    $$(".knots i").forEach((k, i) => k.classList.toggle("on", i < n));
    const ready = n === 3;
    const was = next.getAttribute("aria-disabled") !== "true";
    next.setAttribute("aria-disabled", String(!ready));
    $("#nextLabel").textContent = ready ? T("notes.ready") : names(raw("notes.locked")[3 - n]);
    skip.hidden = ready;
    if (ready && !was && animate && !reduced()) next.animate([{ transform: "scale(1)" }, { transform: "scale(1.07)" }, { transform: "scale(1)" }], { duration: 700, easing: SPRING });
  }
  next.addEventListener("click", (e) => {
    if (next.getAttribute("aria-disabled") === "true") {
      const i = state.done.indexOf(false);
      const st = S2.stations[i];
      st.scrollIntoView({ behavior: reduced() ? "auto" : "smooth", block: "center" });
      if (!reduced()) $(".bead-wrap, .spool, .stitch", st).forEach((w) =>
        w.animate([{ transform: "none" }, { transform: "translateX(-8px)" }, { transform: "translateX(7px)" }, { transform: "translateX(-4px)" }, { transform: "none" }], { duration: 620, delay: 380, easing: EASE_OUT }));
      buzz([6, 30, 6]);
      say(T("notes.nudge"));
      return;
    }
    buzz(10);
    go(3, center(e.currentTarget));
  });
  skip.addEventListener("click", (e) => { buzz(6); go(3, center(e.currentTarget)); });

  /* ======================================================================
     Screen 3 — the letter, then the knot
     ====================================================================== */
  const L3 = {
    el: screens[3], body: $("#letterBody"), svg: $("#t3"), thread: $("#t3path"), sign: $("#sign"),
    finale: $("#finale"), after: $("#after"), choices: $("#choices"), showAll: $("#showAll"),
    anims: [], timers: [], started: false, finaleOn: false, userScrolled: false,
  };
  function splitLines(p, text) {
    p.textContent = "";
    const spans = text.split(/\s+/).map((w) => { const s = document.createElement("span"); s.textContent = w + " "; p.appendChild(s); return s; });
    const lines = []; let top = null, cur;
    spans.forEach((s) => { if (s.offsetTop !== top) { cur = []; lines.push(cur); top = s.offsetTop; } cur.push(s.textContent); });
    p.textContent = "";
    lines.forEach((ws) => {
      const ln = document.createElement("span"); ln.className = "ln";
      const inner = document.createElement("span"); inner.className = "ln__in";
      inner.textContent = ws.join("").trimEnd() + " ";
      ln.appendChild(inner); p.appendChild(ln);
    });
  }
  function buildLetter() {
    let ps = $$("p", L3.body);
    if (!ps.length) ps = CONFIG.apology.map(() => L3.body.appendChild(document.createElement("p")));
    ps.forEach((p, i) => splitLines(p, names(CONFIG.apology[i])));
    const h = L3.body.offsetHeight;
    L3.svg.setAttribute("viewBox", `0 0 16 ${h}`);
    let d = "M8 0";
    for (let y = 0, k = 0; y < h; y += 64, k++) d += ` Q${k % 2 ? 2 : 14} ${y + 32} 8 ${Math.min(y + 64, h)}`;
    L3.thread.setAttribute("d", d);
  }
  const add = (el, kf, dur, delay, easing = EASE_OUT) => { const a = el.animate(kf, { duration: dur, delay, easing, fill: "backwards" }); L3.anims.push(a); return a; };
  const later = (fn, ms) => L3.timers.push(setTimeout(fn, ms));

  function startLetter() {
    if (state.letterRead || reduced()) { setLetterDone(); return; }
    if (L3.started) return;
    L3.started = true; L3.userScrolled = false;
    L3.showAll.hidden = false;
    L3.choices.inert = true;
    const rise = [{ transform: "translateY(105%)", opacity: 0 }, { transform: "none", opacity: 1 }];
    let t = 350;
    $$("p", L3.body).forEach((p) => {
      const at = t;
      later(() => {
        if (L3.userScrolled) return;
        const r = p.getBoundingClientRect(), ch = L3.el.clientHeight;
        if (r.bottom > ch * .82) L3.el.scrollBy({ top: r.bottom - ch * .55, behavior: "smooth" });
      }, at);
      $$(".ln__in", p).forEach((ln) => {
        add(ln, rise, 850, t);
        t += 170 + ln.textContent.trim().split(/\s+/).length * 105;
      });
      t += 280;
    });
    add(L3.thread, [{ strokeDasharray: "1 1", strokeDashoffset: 1 }, { strokeDasharray: "1 1", strokeDashoffset: 0 }], t - 350, 350, "linear");
    add(L3.sign, [{ opacity: 0, transform: "translateY(16px)" }, { opacity: 1, transform: "none" }], 900, t);
    later(() => playFinale(false), t + 900);
  }

  function playFinale(instant) {
    if (L3.finaleOn) return;
    L3.finaleOn = true;
    L3.finale.classList.add("is-on");
    L3.after.classList.add("is-on");
    if (instant || reduced()) { setLetterDone(); return; }
    const sc = L3.el, r = L3.finale.getBoundingClientRect();
    if (r.bottom > sc.clientHeight) sc.scrollBy({ top: r.top - sc.clientHeight * .18, behavior: "smooth" });
    const path = $("#knotPath");
    add(path, [{ strokeDasharray: "1 1", strokeDashoffset: 1 }, { strokeDasharray: "1 1", strokeDashoffset: 0 }], 1700, 250, EASE_IO);
    add($("#knotG"), [{ transform: "scale(1.14) translateY(-6px)" }, { transform: "none" }], 1100, 1850, SPRING);
    add($("#knotGlow"), [{ opacity: 0, transform: "scale(.3)" }, { opacity: 1, transform: "scale(.9)", offset: .3 }, { opacity: .35, transform: "scale(1.5)" }], 1800, 1850, EASE_OUT);
    $$(".knot-name").forEach((n, i) => add(n, [{ opacity: 0, transform: `translateX(${i ? 14 : -14}px)` }, { opacity: 1, transform: "none" }], 900, 300 + i * 120));
    $$(".ln__in", $("#payoff")).forEach((ln, i) => add(ln, [{ transform: "translateY(110%)" }, { transform: "none" }], 1100, 2050 + i * 120));
    later(() => {
      buzz([20, 60, 30]); sound.chime();
      $("#sweep").animate([{ opacity: 0, transform: "translateX(110%)" }, { opacity: 1, offset: .25 }, { opacity: 0, transform: "translateX(-110%)" }], { duration: 1700, easing: EASE_IO });
    }, 1850);
    $$(".choice:not([hidden])", L3.choices).forEach((c, i) => add(c, [{ opacity: 0, transform: "translateY(20px)" }, { opacity: 1, transform: "none" }], 800, 2800 + i * 130));
    later(() => {
      const r2 = L3.after.getBoundingClientRect();
      if (r2.bottom > sc.clientHeight && !L3.userScrolled) sc.scrollBy({ top: r2.bottom - sc.clientHeight + 40, behavior: "smooth" });
    }, 2700);
    later(setLetterDone, 3800);
  }
  function setLetterDone() {
    L3.timers.forEach(clearTimeout); L3.timers = [];
    L3.anims.forEach((a) => a.cancel()); L3.anims = [];
    L3.finaleOn = true;
    L3.finale.classList.add("is-on"); L3.after.classList.add("is-on");
    L3.choices.inert = false;
    L3.showAll.hidden = true;
    state.letterRead = true;
  }
  function finishLetter() { if (L3.started && !state.letterRead) setLetterDone(); }
  L3.showAll.addEventListener("click", () => { finishLetter(); L3.after.scrollIntoView({ behavior: reduced() ? "auto" : "smooth", block: "end" }); $("#s3-title").focus({ preventScroll: true }); });
  ["wheel", "touchmove", "keydown"].forEach((ev) => L3.el.addEventListener(ev, () => { L3.userScrolled = true; }, { passive: true }));

  /* --- talk / copy / time --- */
  const reply = $("#reply"), replyText = $("#replyText");
  const msg = names(CONFIG.whatsappMessage);
  const number = String(CONFIG.whatsappNumber || "").replace(/\D/g, "");
  function showReply(text, quote) {
    replyText.textContent = text;
    if (quote) { const q = document.createElement("q"); q.textContent = quote; replyText.appendChild(q); }
    const fresh = reply.hidden;
    reply.hidden = false;
    if (!reduced()) reply.animate([{ opacity: 0, transform: fresh ? "translateY(12px)" : "scale(.98)" }, { opacity: 1, transform: "none" }], { duration: 600, easing: EASE_OUT });
  }
  async function copyText(t) {
    try { await navigator.clipboard.writeText(t); return true; }
    catch (_) {
      const ta = document.createElement("textarea");
      ta.value = t; ta.setAttribute("readonly", ""); ta.style.cssText = "position:fixed;opacity:0;inset:0";
      document.body.appendChild(ta); ta.select();
      let ok = false; try { ok = document.execCommand("copy"); } catch (_) {}
      ta.remove(); return ok;
    }
  }
  if (number) {
    const a = $("#talkLink");
    a.href = `https://wa.me/${number}?text=${encodeURIComponent(msg)}`;
    a.hidden = false;
    a.addEventListener("click", () => { buzz(10); showReply(T("letter.talkReply")); });
  } else {
    const b = $("#talkCopy");
    b.hidden = false;
    b.addEventListener("click", async () => {
      buzz(10);
      if (await copyText(msg)) {
        b.dataset.done = "true";
        $("use", b).setAttribute("href", "#i-check");
        $("#copyLabel").textContent = T("letter.copied");
        sound.pluck(784);
        showReply(T("letter.copyReply"));
      } else showReply(T("letter.copyFail"), msg);
    });
  }
  $("#timeBtn").addEventListener("click", () => { buzz(6); showReply(T("letter.timeReply")); });

  /* ---------------- resize ---------------- */
  let rt = 0;
  addEventListener("resize", () => {
    clearTimeout(rt);
    rt = setTimeout(() => {
      layoutS1();
      if (!L3.started || state.letterRead) buildLetter();
      layoutS2();
    }, 150);
  });

  /* ---------------- boot ---------------- */
  buildLetter();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (!L3.started || state.letterRead) buildLetter(); layoutS1(); layoutS2(); });
  try { if (!location.hash) history.replaceState(null, "", "#1"); } catch (_) { /* sandboxed frame: URL is read-only */ }
  const first = parseHash();
  memScreen = first;
  if (first > 1) state.pulled = true;
  show(first, { instant: true });
  introS1();
})();
</script>
</body>
</html>
